<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip Uses</title>

<style>
body {
  margin:0;
  background:#000;
  font-family:Arial, sans-serif;
}

.hero {
  position:relative;
}

.hero img {
  width:100%;
  display:block;
}

.buttons {
  position:absolute;
  bottom:110px;
  left:60px;
  display:flex;
  gap:15px;
}
.tap-link-wrap{
  position:absolute;
  left:390px;
  top:500px;
  z-index:3;
}

.tap-link{
  display:inline-block;
  padding:8px 16px;
  border-radius:999px;
  text-decoration:none;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
  color:#f5d984;
  background:rgba(10,10,10,.28);
  border:1px solid rgba(212,175,55,.38);
  box-shadow:
    0 0 10px rgba(212,175,55,.22),
    0 0 24px rgba(212,175,55,.12),
    inset 0 0 8px rgba(212,175,55,.08);
  backdrop-filter: blur(2px);
}

.tap-link:hover{
  filter:brightness(1.08);
  box-shadow:
    0 0 14px rgba(212,175,55,.32),
    0 0 30px rgba(212,175,55,.18),
    inset 0 0 10px rgba(212,175,55,.10);
}

@media (max-width: 900px){
  .tap-link-wrap{
    left:42px;
    top:245px;
  }
}

@media (max-width: 720px){
  .tap-link-wrap{
    left:20px;
    top:auto;
    bottom:95px;
  }

  .tap-link{
    font-size:14px;
    padding:8px 14px;
  }
}
</style>
</head>

<body>

<div class="hero">
  <img src="chip.png">

<div class="tap-link-wrap">
  <a href="buy.html" class="tap-link">Tap here to buy your chip</a>
</div>  
</div>

</body>
</html>
