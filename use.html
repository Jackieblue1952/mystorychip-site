<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip Uses</title>

<style>
body {
  margin:0;
  background:#000;
  font-family:Arial, sans-serif;
}

.hero {
  position:relative;
}

.hero img {
  width:100%;
  display:block;
}

.buttons {
  position:absolute;
  bottom:110px;
  left:60px;
  display:flex;
  gap:15px;
}
.tap-link-wrap{
  position:absolute;
  left:460px;
  top:580px;
  z-index:3;
}

.tap-link{
  display:block;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#ff2a2a;

  box-shadow:
    0 0 10px rgba(255,0,0,.8),
    0 0 20px rgba(255,0,0,.6),
    0 0 35px rgba(255,0,0,.4);

  cursor:pointer;
}

.tap-link:hover{
  box-shadow:
    0 0 16px rgba(255,0,0,.9),
    0 0 32px rgba(255,0,0,.6),
    inset 0 0 10px rgba(255,0,0,.25);
}

.tap-link:hover{
  filter:brightness(1.08);
  box-shadow:
    0 0 14px rgba(212,175,55,.32),
    0 0 30px rgba(212,175,55,.18),
    inset 0 0 10px rgba(212,175,55,.10);
}

@media (max-width: 900px){
  .tap-link-wrap{
    left:42px;
    top:245px;
  }
}

@media (max-width: 720px){
  .tap-link-wrap{
    left:20px;
    top:auto;
    bottom:95px;
  }

.tap-link{
  display:block;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#ff2a2a;

  box-shadow:
    0 0 10px rgba(255,0,0,.8),
    0 0 20px rgba(255,0,0,.6),
    0 0 35px rgba(255,0,0,.4);

  cursor:pointer;
}
  .tap-link:hover{
  color:#ffffff;
  box-shadow:
    0 0 16px rgba(255,0,0,.55),
    0 0 32px rgba(255,0,0,.30),
    inset 0 0 10px rgba(255,0,0,.15);
}
</style>
</head>

<body>

<div class="hero">
  <img src="chip.png">

<div class="tap-link-wrap">
  <a href="buy.html" class="tap-link"></a>
</div>  
</div>

</body>
</html>
