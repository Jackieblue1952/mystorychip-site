<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your PIN — MyStoryChip</title>
  <style>
    :root {
      --navy: #020d1b;
      --panel: #07182d;
      --blue: #168cff;
      --line: #385878;
      --text: #eef5ff;
      --muted: #9fb0c5;
      --error: #ff5757;
      --success: #58d68d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at top, #0b2b50, var(--navy) 48%);
      font-family: Georgia, "Times New Roman", serif;
    }

    .home {
      position: fixed;
      top: 18px;
      left: 18px;
      padding: 11px 18px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(4, 18, 35, 0.92);
    }

    .card {
      width: min(560px, 100%);
      padding: 38px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(4, 18, 35, 0.96);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    .brand {
      margin: 0 0 10px;
      text-align: center;
      color: #b9dcff;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(2rem, 7vw, 3rem);
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      color: var(--text);
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #020c19;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 140, 255, 0.18);
    }

    button,
    .story-link {
      width: 100%;
      padding: 14px 20px;
      color: white;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      border: 1px solid #6dbaff;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(#1798ff, #0865d6);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      display: none;
      margin: 20px 0 0;
      padding: 14px;
      line-height: 1.45;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #020c19;
    }

    .status.error {
      display: block;
      color: var(--error);
    }

    .status.success {
      display: block;
      color: var(--success);
    }

    .story-link {
      display: none;
      margin-top: 18px;
    }

    @media (max-width: 600px) {
      body {
        padding-top: 82px;
      }

      .card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <a class="home" href="index.html">🏠 Home</a>

  <main class="card">
    <p class="brand">MYSTORYCHIP</p>
    <h1 id="pageTitle">Forgot Your PIN?</h1>
    <p class="intro" id="pageIntro">
      Enter your chip code and registered email address.
      If they match our records, we will email a secure reset link.
    </p>

    <form id="requestForm">
      <label>
        Chip Code
        <input
          id="requestCode"
          autocomplete="off"
          placeholder="MSC-0000"
          required
        >
      </label>

      <label>
        Registered Email Address
        <input
          id="requestEmail"
          type="email"
          autocomplete="email"
          required
        >
      </label>

      <button id="requestButton" type="submit">
        Email My Reset Link
      </button>
    </form>

    <form id="resetForm" hidden>
      <label>
        New 4-Digit PIN
        <input
          id="newPin"
          type="password"
          inputmode="numeric"
          maxlength="4"
          autocomplete="new-password"
          required
        >
      </label>

      <label>
        Confirm New PIN
        <input
          id="confirmPin"
          type="password"
          inputmode="numeric"
          maxlength="4"
          autocomplete="new-password"
          required
        >
      </label>

      <button id="resetButton" type="submit">
        Save New PIN
      </button>
    </form>

    <div id="status" class="status" role="status"></div>
    <a id="storyLink" class="story-link">Return to My Story</a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = String(params.get("code") || "").trim();
    const token = String(params.get("token") || "").trim();

    const requestForm = document.getElementById("requestForm");
    const resetForm = document.getElementById("resetForm");
    const status = document.getElementById("status");
    const storyLink = document.getElementById("storyLink");

    document.getElementById("requestCode").value = code;

    function showStatus(message, type) {
      status.textContent = message;
      status.className = `status ${type}`;
    }

    if (code && token) {
      requestForm.hidden = true;
      resetForm.hidden = false;
      document.getElementById("pageTitle").textContent =
        "Create a New PIN";
      document.getElementById("pageIntro").textContent =
        `Choose a new 4-digit PIN for ${code}.`;
    }

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = document.getElementById("requestButton");
      button.disabled = true;
      status.className = "status";

      try {
        const response = await fetch("/api/pin-reset-request", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            code:
              document.getElementById("requestCode").value.trim(),
            email:
              document.getElementById("requestEmail").value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error || "Reset request could not be processed."
          );
        }

        showStatus(data.message, "success");
        requestForm.reset();
      } catch (err) {
        showStatus(err.message, "error");
      } finally {
        button.disabled = false;
      }
    });

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const pin = document.getElementById("newPin").value.trim();
      const pinConfirm =
        document.getElementById("confirmPin").value.trim();

      if (!/^\d{4}$/.test(pin) || pin !== pinConfirm) {
        showStatus(
          "Enter and confirm a matching 4-digit PIN.",
          "error"
        );
        return;
      }

      const button = document.getElementById("resetButton");
      button.disabled = true;
      status.className = "status";

      try {
        const response = await fetch("/api/pin-reset", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            code,
            token,
            pin,
            pinConfirm
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error || "PIN could not be reset."
          );
        }

        window.history.replaceState(
          {},
          "",
          `reset-pin.html?code=${encodeURIComponent(code)}`
        );

        resetForm.hidden = true;
        document.getElementById("pageTitle").textContent =
          "PIN Changed";
        document.getElementById("pageIntro").textContent =
          "Your new PIN is ready to use.";
        showStatus(data.message, "success");

        storyLink.href =
          `chip.html?code=${encodeURIComponent(code)}`;
        storyLink.style.display = "block";
      } catch (err) {
        showStatus(err.message, "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
