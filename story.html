<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
  overflow-x: hidden;
}

/* FULL IMAGE HERO */

.hero {
  position: relative;
  min-height: 100vh;
  background: url("chip.png") center center / cover no-repeat;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  padding: 0 0 60px 60px;
  box-sizing: border-box;
}

/* BUTTON CONTAINER */

.hero-buttons {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

/* BUTTON STYLE */

.cta-btn {
  padding: 15px 30px;
  font-size: 18px;
  background: #d4a84f;
  color: black;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  transition: 0.3s;
}

.cta-btn:hover {
  background: #f0c36a;
  transform: scale(1.05);
}

.cta-btn.alt {
  background: transparent;
  border: 2px solid #d4a84f;
  color: #d4a84f;
}

.cta-btn.alt:hover {
  background: #d4a84f;
  color: black;
}

/* MOBILE FIX */

@media (max-width: 900px) {
  .hero {
    padding: 0 0 40px 20px;
    align-items: flex-end;
  }

  .cta-btn {
    font-size: 16px;
    padding: 12px 22px;
  }
}

</style>
</head>

<body>

<section class="hero">
  <div class="hero-buttons">
    <a href="personal.html" class="cta-btn">PERSONAL</a>
    <a href="business.html" class="cta-btn alt">BUSINESS</a>
  </div>
</section>

</body>
</html>
