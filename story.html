<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStoryChip Story Editor</title>
</head>
<body>

    <h1>MyStoryChip Story Page</h1>

    <p id="chipid"></p>

    <h2>My Story</h2>

    <textarea id="storytext" rows="10" cols="60" placeholder="Write the story for this chip..."></textarea>

    <br><br>

    <button onclick="saveStory()">Save Story</button>

    <p id="storydisplay"></p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const chip = params.get("chip");

        if (chip) {
            document.getElementById("chipid").innerText = "Chip ID: " + chip;

 fetch("https://storychipbackend-production.up.railway.app/api/chip/" + chip)
.then(res => res.json())
.then(data => {
    document.getElementById("storytext").value = data.story || "";
}); 
                .catch(err => {
                    console.log("No story found yet", err);
                    document.getElementById("storytext").value = "";
                });
        } else {
            document.getElementById("chipid").innerText = "No chip selected.";
        }

        function saveStory() {
            const story = document.getElementById("storytext").value;

            if (!chip) {
                document.getElementById("storydisplay").innerText = "No chip selected.";
                return;
            }

            fetch("https://storychipbackend-production.up.railway.app/api/chip/story", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    chip_id: chip,
                    story: story
                })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("storydisplay").innerText = "Story saved!";
            })
            .catch(err => {
                console.log("Error saving story", err);
                document.getElementById("storydisplay").innerText = "Error saving story";
            });
        }
    </script>

</body>
</html>
