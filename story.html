<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStoryChip Story</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #f5e7c2;
      overflow-x: hidden;
    }

    .hero {
  position: relative;
  width: 100%;
  height: 110vh;
  background: url("chip.png") center center / cover no-repeat;
}

    .action-strip {
      background: linear-gradient(to bottom, #0b0603, #140904);
      padding: 40px 20px 50px;
      text-align: center;
      border-top: 1px solid rgba(212, 168, 79, 0.18);
    }

    .action-strip h2 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 48px);
      color: #f2dfb0;
    }

    .action-strip p {
      margin: 0 auto 28px;
      max-width: 700px;
      font-size: 20px;
      line-height: 1.5;
      color: #d9c79a;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .choice-btn {
      display: inline-block;
      min-width: 180px;
      padding: 16px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .tap-overlay {
  position: absolute;   
      top: 460px;
  left: 120px;
width: 340px;
  height: 80px;
 border-radius: 50px;
  cursor: pointer;
display: block;
  z-index: 10;
background: rgba(255, 0, 0, 0.25);
} 

    .choice-btn.primary {
      background: linear-gradient(145deg, #e6bc6e, #c8952f);
      color: #1a1206;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .choice-btn.secondary {
      background: transparent;
      color: #d9b15a;
      border: 2px solid #d9b15a;
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }

    .choice-btn:hover {
      transform: translateY(-2px);
    }

    .choice-btn.primary:hover {
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .choice-btn.secondary:hover {
      background: rgba(217, 177, 90, 0.08);
    }

    @media (max-width: 900px) {
      .hero-image {
        height: 62vh;
        background-position: center top;
      }

      .action-strip {
        padding: 32px 18px 42px;
      }

      .action-strip p {
        font-size: 18px;
      }

      .choice-btn {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>

 <section class="hero">
   <a href="personal.html" class="tap-overlay"></a>
   </section> 

  <section class="action-strip">
    
   
  </section>

</body>
</html>
