<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>

body { 
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #1a1408 0%, #000 70%);
  color: white;
   overflow-x: hidden;
}
 

/* HERO SECTION */

.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 50px;
  min-height: 100vh;
  padding: 40px 60px;
  box-sizing: border-box;
}

.hero-left {
  flex: 0 0 42%;
  max-width: 42%;
}
  .hero-right {
  flex: 0 0 58%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.tagline {
  display: inline-block;
  padding: 10px 20px;
  border-radius: 30px;
  border: 1px solid #d4a84f;
  color: #d4a84f;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

.hero h1 {
  font-size: 70px;
  line-height: 1.1;
  margin: 0;
}

.hero h1 {
  font-size: clamp(48px, 6vw, 78px);
  line-height: 1.05;
  margin: 0 0 20px 0;
}

.hero p {
  font-size: 28px;
  line-height: 1.45;
  margin: 0 0 30px 0;
  color: #ddd;
  max-width: 540px;
}

.cta {
  padding: 15px 30px;
  font-size: 18px;
  background: #d4a84f;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
}
  .cta-group {
  display: flex;
  gap: 20px;
  margin-top: 30px;
}

.cta-btn {
  padding: 15px 30px;
  font-size: 18px;
  background: #d4a84f;
  color: black;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  transition: 0.3s;
}

.cta-btn:hover {
  background: #f0c36a;
  transform: scale(1.05);
}

.cta-btn.alt {
  background: transparent;
  border: 2px solid #d4a84f;
  color: #d4a84f;
}

.cta-btn.alt:hover {
  background: #d4a84f;
  color: black;
}

.hero-right img {
  width: 100%;
  max-width: 760px;
  height: auto;
  display: block;
  border-radius: 20px;
}
.cta-group {
  display: flex;
  gap: 20px;
  margin-top: 30px;
}

.cta-btn {
  display: inline-block;
  padding: 15px 30px;
  font-size: 18px;
  background: #d4a84f;
  color: black;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  transition: 0.3s;
}

.cta-btn:hover {
  background: #f0c36a;
  transform: scale(1.05);
}

.cta-btn.alt {
  background: transparent;
  border: 2px solid #d4a84f;
  color: #d4a84f;
}

.cta-btn.alt:hover {
  background: #d4a84f;
  color: black;
}
</style>
</head>

<body>

<section class="hero">

  <div class="hero-left">
    <div class="tagline">TAP. OPEN. REMEMBER.</div>

    <h1>
      Every object has a story.<br>
      <span>Now you can tap into it</span>
    </h1>

    <p>
      Tap your phone. Instantly unlock memories,
      information, and meaning.
    </p>

    <div class="cta-group">
  <a href="personal.html" class="cta-btn">PERSONAL</a>
  <a href="business.html" class="cta-btn alt">BUSINESS</a>
</div>

  <div class="hero-right">
 <img src="chip.png">
  </div>

</section>

</body>
</html>
