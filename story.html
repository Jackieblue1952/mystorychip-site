<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  overflow-x: hidden;
}

/* HERO IMAGE */

.hero {
  position: relative;
  min-height: 100vh;
  background: url("chip.png") center center / cover no-repeat;
}

/* GOLD OVERLAY PANEL */

.overlay-panel {
  position: absolute;
  bottom: 188px;
  left: 100px;

  background: linear-gradient(145deg, #e0b566, #c79a3d);
  padding: 14px 18px;
  border-radius: 60px;

  display: flex;
  gap: 10px;
  align-items: center;

  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* BUTTONS INSIDE PANEL */

.overlay-btn {
  padding: 12px 22px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  transition: 0.3s;
}

/* PERSONAL (dark on gold) */

.overlay-btn.primary {
  background: black;
  color: #d4a84f;
}

/* BUSINESS (outline style) */

.overlay-btn.secondary {
  border: 2px solid black;
  color: black;
}

/* HOVER EFFECT */

.overlay-btn:hover {
  transform: scale(1.05);
}

/* MOBILE ADJUSTMENT */

@media (max-width: 900px) {
  .overlay-panel {
    left: 20px;
    bottom: 40px;
    flex-direction: column;
    align-items: stretch;
  }

  .overlay-btn {
    text-align: center;
  }
}

</style>
</head>

<body>

<section class="hero">

  <div class="overlay-panel">
    <a href="personal.html" class="overlay-btn primary">PERSONAL</a>
    <a href="business.html" class="overlay-btn secondary">BUSINESS</a>
  </div>

</section>

</body>
</html>
