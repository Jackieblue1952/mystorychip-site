<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #1a1408 0%, #000 70%);
  color: white;
}

/* HERO SECTION */

.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100vh;
  padding: 60px;
}

.hero-left {
  max-width: 50%;
}

.tagline {
  display: inline-block;
  padding: 10px 20px;
  border-radius: 30px;
  border: 1px solid #d4a84f;
  color: #d4a84f;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

.hero h1 {
  font-size: 70px;
  line-height: 1.1;
  margin: 0;
}

.hero h1 span {
  color: #d4a84f;
}

.hero p {
  font-size: 22px;
  margin: 25px 0;
  color: #ddd;
}

.cta {
  padding: 15px 30px;
  font-size: 18px;
  background: #d4a84f;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
}
  .cta-group {
  display: flex;
  gap: 20px;
  margin-top: 30px;
}

.cta-btn {
  padding: 15px 30px;
  font-size: 18px;
  background: #d4a84f;
  color: black;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  transition: 0.3s;
}

.cta-btn:hover {
  background: #f0c36a;
  transform: scale(1.05);
}

.cta-btn.alt {
  background: transparent;
  border: 2px solid #d4a84f;
  color: #d4a84f;
}

.cta-btn.alt:hover {
  background: #d4a84f;
  color: black;
}

.hero-right img {
  max-width: 600px;
  border-radius: 20px;
}

</style>
</head>

<body>

<section class="hero">

  <div class="hero-left">
    <div class="tagline">TAP. OPEN. REMEMBER.</div>

    <h1>
      Every object has a story.<br>
      <span>Now you can tap into it</span>
    </h1>

    <p>
      Tap your phone. Instantly unlock memories,
      information, and meaning.
    </p>

    <div class="cta-group">
  <a href="personal.html" class="cta-btn">PERSONAL</a>
  <a href="business.html" class="cta-btn alt">BUSINESS</a>
</div>

  <div class="hero-right">
 <img src="chip.png">
  </div>

</section>

</body>
</html>
