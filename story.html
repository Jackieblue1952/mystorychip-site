<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip | The Story</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0a0a;
  font-family: Georgia, "Times New Roman", serif;
  overflow: hidden;
}

/* FULL SCREEN */
.page {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* IMAGE */
.poster-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.poster {
  position: relative;
  width: 100%;
  height: 100%;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* BACK BUTTON */
.back-link {
  position: absolute;
  top: 18px;
  left: 18px;

  padding: 6px 14px;
  font-size: 0.8rem;
  color: #f5e6c8;
  text-decoration: none;

  background: rgba(212,175,55,0.08);
  border: 1px solid rgba(212,175,55,0.25);
  border-radius: 999px;

  backdrop-filter: blur(4px);
}

/* BUTTON ZONES */
.button-zone {
  position: absolute;
  width: 220px;
  height: 60px;
  transform: translateX(-50%);
  left: 50%;
  cursor: pointer;
}

/* PERSONAL */
.personal-link {
  bottom: 90px;
}

/* BUSINESS */
.business-link {
  bottom: 20px;
}

/* HOVER GLOW */
.button-zone:hover {
  box-shadow:
    0 0 20px rgba(255,215,120,0.35),
    0 0 40px rgba(212,175,55,0.25);
}

/* OPTIONAL: subtle pulse */
@keyframes pulseGlow {
  0% { box-shadow: 0 0 10px rgba(255,215,120,0.2); }
  50% { box-shadow: 0 0 35px rgba(255,215,120,0.45); }
  100% { box-shadow: 0 0 10px rgba(255,215,120,0.2); }
}

.button-zone {
  animation: pulseGlow 4s ease-in-out infinite;
}

</style>
</head>

<body>

<div class="page">

  <div class="poster-wrap">
    <div class="poster">

      <img src="story-page.png" alt="MyStoryChip Story">

      <!-- BACK -->
      <a href="index.html" class="back-link">Back</a>

      <!-- PERSONAL -->
      <a href="personal.html" class="button-zone personal-link"></a>

      <!-- BUSINESS -->
      <a href="business.html" class="button-zone business-link"></a>

    </div>
  </div>

</div>

</body>
</html>
