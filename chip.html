<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Chip | MyStoryChip</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(10,10,10,0.82), rgba(10,10,10,0.94)),
        url("landing-page.png") center center / cover no-repeat fixed;
      color: #f5e6c8;
      padding: 26px;
      overflow-y: auto;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .brand {
      color: #d4af37;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
    }

    .back-link {
      color: #f5e6c8;
      text-decoration: none;
      border: 1px solid rgba(245, 230, 200, 0.24);
      padding: 10px 14px;
      border-radius: 10px;
      transition: 0.2s ease;
    }

    .back-link:hover {
      border-color: rgba(212,175,55,0.45);
      color: #fff;
    }

    .card {
      background: rgba(20, 20, 20, 0.88);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.16);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 36px;
      line-height: 1.15;
    }

    .sub {
      color: #d4af37;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .label {
      color: #d4af37;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .value {
      color: #f5e6c8;
      font-size: 18px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .empty {
      color: #cdbf9f;
      font-style: italic;
    }

    .gallery-note {
      color: #cdbf9f;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-start;
    }

    .thumb {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.2);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 0 10px rgba(0,0,0,0.28);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .message {
      background: rgba(20, 20, 20, 0.88);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 24px rgba(212,175,55,0.14);
    }

    .message h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .message p {
      font-size: 18px;
      line-height: 1.6;
      color: #e8dcc0;
    }

    .message a {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 18px;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-panel {
      position: relative;
      max-width: min(94vw, 1200px);
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      display: block;
      max-width: 94vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid rgba(212,175,55,0.25);
      box-shadow: 0 0 30px rgba(212,175,55,0.18);
      background: #111;
    }

    .lightbox-close {
      position: absolute;
      top: -10px;
      right: -2px;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,0.28);
      background: rgba(20,12,4,0.88);
      color: #f5d97a;
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lightbox-close:hover {
      color: #fff;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 30px;
      }

      .value {
        font-size: 17px;
      }

      .thumb {
        width: 92px;
        height: 92px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">MyStoryChip</div>
      <a id="editLinkTop" class="back-link" href="client-setup.html">Edit This Chip</a>
    </div>

    <div id="chipContainer"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-panel">
      <button type="button" class="lightbox-close" id="lightboxClose">×</button>
      <img id="lightboxImg" src="" alt="Expanded image">
    </div>
  </div>

  <script>
    const STORAGE_KEY = "mscChips";

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    const chipContainer = document.getElementById("chipContainer");
    const editLinkTop = document.getElementById("editLinkTop");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");

    function safeText(value) {
      return value && String(value).trim() ? String(value) : "";
    }

    function renderMissing(message) {
      chipContainer.innerHTML = `
        <div class="message">
          <h2>Chip Not Found</h2>
          <p>${message}</p>
          <a href="dashboard.html">Return to Dashboard</a>
        </div>
      `;
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("active");
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
      lightboxImg.src = "";
    }

    if (!code) {
      renderMissing("No chip code was found in the page link.");
    } else {
      editLinkTop.href = `client-setup.html?code=${encodeURIComponent(code)}`;

      let chips = [];
      try {
        chips = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (err) {
        chips = [];
      }

      const chip = chips.find(item => item && item.code === code);

      if (!chip) {
        renderMissing(`We could not find a saved chip with code ${code}.`);
      } else {
        const images = Array.isArray(chip.images) ? [...new Set(chip.images.filter(Boolean))] : [];

        const displayName = safeText(chip.name) || safeText(chip.title) || "Untitled Chip";
        const displayType = safeText(chip.type) || "Not set";
        const displayCategory = safeText(chip.category) || "Not set";
        const displayStory = safeText(chip.story) || safeText(chip.headline) || "";
        const displayDetails = safeText(chip.details) || safeText(chip.desc) || safeText(chip.description) || "";
        const displayCode = safeText(chip.code) || "";
        const displayStatus = safeText(chip.status) || "Saved";

        chipContainer.innerHTML = `
          <div class="card">
            <h1>${displayName}</h1>
            <div class="sub">Chip Code: ${displayCode}</div>

            <div class="section">
              <div class="label">Status</div>
              <div class="value">${displayStatus}</div>
            </div>

            <div class="section">
              <div class="label">Type</div>
              <div class="value">${displayType}</div>
            </div>

            <div class="section">
              <div class="label">Category</div>
              <div class="value">${displayCategory}</div>
            </div>

            <div class="section">
              <div class="label">Story</div>
              <div class="value ${displayStory ? "" : "empty"}">
                ${displayStory ? displayStory.replace(/\n/g, "<br>") : "No story added yet."}
              </div>
            </div>

            <div class="section">
              <div class="label">Details</div>
              <div class="value ${displayDetails ? "" : "empty"}">
                ${displayDetails ? displayDetails.replace(/\n/g, "<br>") : "No details added yet."}
              </div>
            </div>

            <div class="section">
              <div class="label">Images</div>
              ${
                images.length
                  ? `
                    <div class="gallery-note">Click any photo to enlarge.</div>
                    <div class="gallery">
                      ${images.map(src => `
                        <div class="thumb" data-src="${src.replace(/"/g, "&quot;")}">
                          <img src="${src}" alt="Chip image">
                        </div>
                      `).join("")}
                    </div>
                  `
                  : `<div class="value empty">No images uploaded yet.</div>`
              }
            </div>
          </div>
        `;

        document.querySelectorAll(".thumb").forEach((thumb) => {
          thumb.addEventListener("click", () => {
            openLightbox(thumb.getAttribute("data-src"));
          });
        });
      }
    }

    lightboxClose.addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
