<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStoryChip</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: #3a2a12;
      background:
        radial-gradient(circle at top center, rgba(255, 230, 150, 0.42), transparent 42%),
        linear-gradient(rgba(255, 248, 232, 0.72), rgba(235, 205, 142, 0.86)),
        url("final-storybook.png") center center / cover no-repeat fixed;
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      gap: 12px;
    }

    .brand {
      color: #6b4b1f;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: bold;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      color: #3a2a12;
      text-decoration: none;
      border: 1px solid rgba(150, 100, 28, 0.34);
      background: rgba(255, 250, 237, 0.82);
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(80, 48, 8, 0.12);
    }

    .hero,
    .panel,
    .message {
      background:
        radial-gradient(circle at top center, rgba(255, 244, 206, 0.92), transparent 56%),
        linear-gradient(180deg, rgba(255,255,255,0.84), rgba(255,246,226,0.78));
      border: 1px solid rgba(172, 119, 35, 0.28);
      border-radius: 30px;
      box-shadow:
        0 20px 55px rgba(78, 48, 9, 0.18),
        inset 0 0 32px rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(3px);
    }

    .hero {
      text-align: center;
      padding: 54px 28px 46px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -140px;
      transform: translateX(-50%);
      width: 620px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 205, 92, 0.36), transparent 70%);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      color: #9a6a1d;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 13px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.4rem, 5vw, 4.6rem);
      line-height: 1.03;
      color: #3a2a12;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    }

    .headline {
      color: #6b4b1f;
      font-size: 1.25rem;
      line-height: 1.6;
      max-width: 760px;
      margin: 0 auto;
    }

    .chip-code {
      margin-top: 18px;
      color: #7a551d;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .panel {
      padding: 30px 26px;
      margin-bottom: 24px;
    }

    .section-title {
      text-align: center;
      color: #5a3b12;
      font-size: 1.65rem;
      margin: 0 0 18px;
    }

    .story-body,
    .section-body {
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 1.08rem;
      color: #3a2a12;
    }

    .structured-card {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px dashed rgba(150, 100, 28, 0.3);
    }

    .structured-type {
      color: #8a642a;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      margin-bottom: 6px;
    }

    .structured-title {
      color: #5a3b12;
      font-size: 1.25rem;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 16px;
    }

    .thumb {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(150, 100, 28, 0.28);
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      min-height: 155px;
      box-shadow: 0 12px 28px rgba(80, 48, 8, 0.18);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      min-height: 155px;
      object-fit: cover;
      display: block;
    }

    .empty {
      text-align: center;
      color: #7a551d;
      font-style: italic;
      line-height: 1.6;
    }

    .credit {
      text-align: center;
      color: #6b4b1f;
      line-height: 1.7;
    }

    .credit strong {
      color: #3a2a12;
    }

    .powered {
      text-align: center;
      padding: 28px 24px;
    }

    .powered-title {
      color: #5a3b12;
      font-size: 1.35rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .powered-line {
      color: #6b4b1f;
      line-height: 1.6;
    }

    .message {
      padding: 34px 24px;
      text-align: center;
    }

    .message h2 {
      color: #5a3b12;
      margin-top: 0;
    }

    .disclaimer {
      max-width: 900px;
      margin: 28px auto 0;
      text-align: center;
      font-size: 0.74rem;
      line-height: 1.55;
      color: #6a5530;
      opacity: 0.82;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 18px;
      border: 1px solid rgba(245, 217, 122, 0.28);
      box-shadow: 0 0 35px rgba(245, 217, 122, 0.18);
     z-index: 5; 
    }

    @media (max-width: 700px) {
      .wrap { padding: 16px; }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero,
      .panel {
        border-radius: 22px;
        padding: 22px 18px;
      }
  .nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.55);
  border: none;
  color: white;
  font-size: 34px;
  padding: 12px 18px;
  cursor: pointer;
  border-radius: 50%;
  z-index: 20;
}

.nav-btn.left {
  left: 20px;
}

.nav-btn.right {
  right: 20px;
}    
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="topbar">
      <div class="brand">MyStoryChip</div>

      <div class="top-actions">
        <a href="index.html" class="btn">Home</a>
        <button type="button" class="btn" onclick="history.back()">Back</button>
      </div>
    </div>

    <div id="content"></div>

    <div class="disclaimer">
      MyStoryChip provides tools for storing and sharing stories, images, and information.
      Access cannot be guaranteed at all times. Users are responsible for the content they choose to store and share.
      Important files should also be backed up separately.
    </div>

  </div>

<div class="lightbox" id="lightbox">
  <button id="prevBtn" class="nav-btn left">&#10094;</button>
  <img id="lightboxImg" src="" alt="Expanded story image">
  <button id="nextBtn" class="nav-btn right">&#10095;</button>
</div>  

  <script>
    const STORAGE_KEY = "mscChips";
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    const content = document.getElementById("content");
    const editLink = document.getElementById("editLink");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    function safe(value) {
      return value && String(value).trim() ? String(value).trim() : "";
    }

    function renderMissing(message) {
      content.innerHTML = `
        <div class="message">
          <h2>Chip Not Found</h2>
          <p>${message}</p>
        </div>
      `;
    }

    if (!code) {
      renderMissing("No chip code was found in the page link.");
    } else {
 if (editLink) {
  editLink.href = `client-setup.html?code=${encodeURIComponent(code)}`;
}   

      let chips = [];

      try {
        chips = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (error) {
        chips = [];
      }

      const chip = chips.find(item => item && item.code === code);

      if (!chip) {
        renderMissing(`We could not find a saved chip with code ${code}.`);
      } else {
        const title = safe(chip.title) || safe(chip.name) || "My Story";
        const headline = safe(chip.headline) || "Every story, item, memory, or detail has a place.";
        const story = safe(chip.desc) || safe(chip.description);
        const creator = safe(chip.fullName) || safe(chip.name) || "a MyStoryChip customer";
  const imageVisibility = safe(chip.imageVisibility) || "public";

  const images = Array.isArray(chip.images)
  ? chip.images.filter(img => {
      if (!img) return false;

      // Handle both formats (old + new)
      if (typeof img === "string") return true;

      const visibility = img.visibility || "public";

      return visibility === "public" || visibility === "both";
    })
  : [];

        const structuredSections = Array.isArray(chip.structuredSections)
          ? chip.structuredSections
          : [];

        const sectionsHTML = structuredSections.length
          ? structuredSections.map(section => `
              <div class="structured-card">
                <div class="structured-type">${safe(section.type) || "Section"}</div>
                <div class="structured-title">${safe(section.title) || "Untitled Section"}</div>
                <div class="section-body">${safe(section.content) || ""}</div>
              </div>
            `).join("")
          : "";

        const galleryHTML = images.length
          ? `
            <div class="gallery">
 ${images.map((img, index) => `
  <div class="thumb" data-index="${index}">
    <img src="${typeof img === "string" ? img : img.src}" alt="Story image ${index + 1}">
  </div>
`).join("")}            
            </div>
          `
          : `<div class="empty">No public photos have been added yet.</div>`;

        content.innerHTML = `
          <section class="hero">
            <div class="hero-inner">
              <div class="eyebrow">Tap. Open. Discover.</div>
              <h1>${title}</h1>
              <div class="headline">${headline}</div>
              <div class="chip-code">Chip Code: ${safe(chip.code)}</div>
            </div>
          </section>

          <section class="panel">
            <h2 class="section-title">The Story</h2>
            <div class="story-body">${story || "No story has been added yet."}</div>
            ${sectionsHTML}
          </section>

<section class="panel">
<h2 class="section-title">Photos & Keepsakes</h2> 
</section>
${galleryHTML}
<section class="panel credit">
Created and shared by <strong>${creator}</strong><br>
through MyStoryChip
</section>

<section class="panel powered">
<div class="powered-title">Powered by MyStoryChip</div>
<div class="powered-line">
Not just a chip — a working digital space for stories, items, memories, and information.
</div>
 </section>
        `;

  const galleryImages = images.map(img =>
  typeof img === "string" ? img : img.src
);  
let currentImageIndex = 0;

function showLightboxImage(index) {
  if (!galleryImages.length) return;
currentImageIndex = (index + galleryImages.length) % galleryImages.length;
lightboxImg.src = galleryImages[currentImageIndex];
}
        

document.querySelectorAll(".thumb").forEach(thumb => {
thumb.addEventListener("click", () => {
const index = Number(thumb.getAttribute("data-index"));
showLightboxImage(index);
lightbox.classList.add("active");            
});
});
}
}
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

prevBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  showLightboxImage(currentImageIndex - 1);
});

nextBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  showLightboxImage(currentImageIndex + 1);
});
lightbox.addEventListener("click", () => {
lightbox.classList.remove("active");
lightboxImg.src = "";
});
/script>
</body>
</html>
