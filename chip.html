<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Chip | MyStoryChip</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(rgba(10,10,10,0.80), rgba(10,10,10,0.93)),
        url("landing-page.png") center center / cover no-repeat fixed;
      color: #f5e6c8;
      padding: 24px;
      overflow-y: auto;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .brand {
      color: #d4af37;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
    }

    .edit-link {
      color: #f5e6c8;
      text-decoration: none;
      border: 1px solid rgba(245, 230, 200, 0.24);
      padding: 10px 14px;
      border-radius: 999px;
      transition: 0.2s ease;
      font-size: 15px;
      background: rgba(20,12,4,0.35);
    }

    .edit-link:hover {
      border-color: rgba(212,175,55,0.45);
      color: #fff;
    }

    .hero-card,
    .section-card,
    .message {
      background: rgba(12, 8, 4, 0.76);
      border: 1px solid rgba(212, 175, 55, 0.24);
      border-radius: 24px;
      box-shadow:
        0 0 18px rgba(212, 175, 55, 0.10),
        0 0 40px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(2px);
    }

    .hero-card {
      padding: 34px 26px;
      margin-bottom: 22px;
      text-align: center;
    }

    .eyebrow {
      color: #f5d97a;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.08;
      color: #f5e6c8;
      text-shadow:
        0 0 10px rgba(212,175,55,0.12),
        0 0 28px rgba(0,0,0,0.7);
    }

    .hero-sub {
      color: #d8c79c;
      font-size: 1rem;
      line-height: 1.6;
      max-width: 640px;
      margin: 0 auto;
    }

    .code-line {
      margin-top: 18px;
      color: #f5d97a;
      font-size: 0.95rem;
      letter-spacing: 0.4px;
    }

    .section-card {
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      margin: 0 0 12px;
      color: #f5d97a;
      font-size: 1.45rem;
    }

    .story-text,
    .detail-text {
      color: #f5e6c8;
      font-size: 1.1rem;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .empty {
      color: #cdbb8f;
      font-style: italic;
    }

    .gallery-note {
      color: #d8c79c;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .thumb {
      width: 118px;
      height: 118px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.25);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 0 10px rgba(0,0,0,0.28);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .info-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,175,55,0.14);
      border-radius: 16px;
      padding: 14px;
    }

    .info-label {
      color: #f5d97a;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .info-value {
      color: #f5e6c8;
      font-size: 1rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .credit {
      text-align: center;
      margin-top: 8px;
      color: #d8c79c;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .credit strong {
      color: #f5d97a;
      font-weight: normal;
    }

    .message {
      padding: 28px 24px;
      text-align: center;
    }

    .message h2 {
      margin-top: 0;
      color: #f5e6c8;
      font-size: 2rem;
    }

    .message p {
      color: #e8dcc0;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .message a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-panel {
      position: relative;
      width: 100%;
      max-width: 1200px;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .lightbox-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-height: 90vh;
    }

    .lightbox img {
      display: block;
      max-width: 88vw;
      max-height: 86vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
      border: 1px solid rgba(212,175,55,0.25);
      box-shadow: 0 0 30px rgba(212,175,55,0.18);
      background: #111;
    }

    .lightbox-close,
    .lightbox-nav {
      border: 1px solid rgba(212,175,55,0.28);
      background: rgba(20,12,4,0.88);
      color: #f5d97a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-close {
      position: absolute;
      top: -10px;
      right: -2px;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      font-size: 20px;
      line-height: 1;
      z-index: 3;
    }

    .lightbox-nav {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      font-size: 24px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .lightbox-close:hover,
    .lightbox-nav:hover {
      color: #fff;
    }

    .lightbox-counter {
      position: absolute;
      bottom: -34px;
      left: 50%;
      transform: translateX(-50%);
      color: #d8c79c;
      font-size: 14px;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .info-grid {
        grid-template-columns: 1fr;
      }

      .thumb {
        width: 96px;
        height: 96px;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .hero-card,
      .section-card,
      .message {
        padding: 18px;
        border-radius: 20px;
      }

      .lightbox-panel {
        gap: 8px;
      }

      .lightbox-nav {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      .lightbox img {
        max-width: 78vw;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">MyStoryChip</div>
      <a id="editLinkTop" class="edit-link" href="client-setup.html">Edit This Chip</a>
    </div>

    <div id="chipContainer"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-panel">
      <button type="button" class="lightbox-nav" id="prevBtn" aria-label="Previous image">‹</button>

      <div class="lightbox-stage">
        <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close image viewer">×</button>
        <img id="lightboxImg" src="" alt="Expanded image">
        <div class="lightbox-counter" id="lightboxCounter"></div>
      </div>

      <button type="button" class="lightbox-nav" id="nextBtn" aria-label="Next image">›</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "mscChips";

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    const chipContainer = document.getElementById("chipContainer");
    const editLinkTop = document.getElementById("editLinkTop");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const lightboxCounter = document.getElementById("lightboxCounter");

    let galleryImages = [];
    let currentImageIndex = 0;

    function safeText(value) {
      return value && String(value).trim() ? String(value) : "";
    }

    function renderMissing(message) {
      chipContainer.innerHTML = `
        <div class="message">
          <h2>Chip Not Found</h2>
          <p>${message}</p>
          <a href="dashboard.html">Return to Dashboard</a>
        </div>
      `;
    }

    function updateLightboxImage() {
      if (!galleryImages.length) return;
      lightboxImg.src = galleryImages[currentImageIndex];
    lightboxCounter.textContent = `${currentImageIndex + 1} of ${galleryImages.length}`;
    }

    function openLightbox(index) {
      currentImageIndex = index;
      updateLightboxImage();
      lightbox.classList.add("active");
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
      lightboxImg.src = "";
    }

    function showPrevImage() {
      if (!galleryImages.length) return;
      currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
      updateLightboxImage();
    }

    function showNextImage() {
      if (!galleryImages.length) return;
      currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
      updateLightboxImage();
    }

    if (!code) {
      renderMissing("No chip code was found in the page link.");
    } else {
    editLinkTop.href = `client-setup.html?code=${encodeURIComponent(code)}`;

      let chips = [];
      try {
        chips = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (err) {
        chips = [];
      }

      const chip = chips.find(item => item && item.code === code);

      if (!chip) {
      renderMissing(`We could not find a saved chip with code ${code}.`);
      } else {
        const images = Array.isArray(chip.images) ? [...new Set(chip.images.filter(Boolean))] : [];
        galleryImages = images;

        const displayTitle = safeText(chip.title) || safeText(chip.name) || "My Story";
        const displayCode = safeText(chip.code) || "";
        const displayStory = safeText(chip.headline) || "A story worth remembering.";
        const displayDetails = safeText(chip.desc) || safeText(chip.description) || "";
        const displayCategory = safeText(chip.category) || "Not set";
        const displayType = safeText(chip.type) || "Personal";
        const displayStatus = safeText(chip.status) || "Saved";
        const creatorName = safeText(chip.fullName) || safeText(chip.name) || "a MyStoryChip customer";

        chipContainer.innerHTML = `
          <div class="hero-card">
            <div class="eyebrow">Your Story</div>
            <h1>${displayTitle}</h1>
            <div class="hero-sub">${displayStory}</div>
            <div class="code-line">Chip Code: ${displayCode}</div>
          </div>

          <div class="section-card">
            <h2 class="section-title">The Story</h2>
            <div class="story-text ${displayDetails ? "" : "empty"}">
              ${displayDetails ? displayDetails : "No story details have been added yet."}
            </div>
          </div>

          <div class="section-card">
            <h2 class="section-title">Photos</h2>
            ${
              images.length
                ? `
                  <div class="gallery-note">Click any photo to enlarge. Use arrows to move through them.</div>
                  <div class="gallery">
                    ${images.map((src, index) => `
                      <div class="thumb" data-index="${index}">
                        <img src="${src}" alt="Chip photo ${index + 1}">
                      </div>
                    `).join("")}
                  </div>
                `
                : `<div class="empty">No photos have been added yet.</div>`
            }
          </div>

          <div class="section-card">
            <h2 class="section-title">Chip Information</h2>
            <div class="info-grid">
              <div class="info-box">
                <div class="info-label">Category</div>
                <div class="info-value">${displayCategory}</div>
              </div>
              <div class="info-box">
                <div class="info-label">Type</div>
                <div class="info-value">${displayType}</div>
              </div>
              <div class="info-box">
                <div class="info-label">Status</div>
                <div class="info-value">${displayStatus}</div>
              </div>
            </div>
          </div>

          <div class="section-card">
            <div class="credit">
              Created and shared by <strong>${creatorName}</strong><br>
              through www.mystorychip.com
            </div>
          </div>
        `;

        document.querySelectorAll(".thumb").forEach((thumb) => {
          thumb.addEventListener("click", () => {
            openLightbox(Number(thumb.getAttribute("data-index")));
          });
        });
      }
    }

    lightboxClose.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", showPrevImage);
    nextBtn.addEventListener("click", showNextImage);

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("active")) return;

      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showPrevImage();
      if (e.key === "ArrowRight") showNextImage();
    });
  </script>
</body>
</html>
