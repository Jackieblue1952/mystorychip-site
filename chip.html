<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Georgia, serif;
  color: #f5e6c8;

  background:
    linear-gradient(rgba(6,6,6,0.75), rgba(6,6,6,0.92)),
    url("landing-page.png") center/cover no-repeat fixed;
}

/* WRAP */
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.brand {
  color: #d4af37;
  letter-spacing: 2px;
  font-size: 13px;
}

.edit-link {
  border: 1px solid rgba(255,255,255,0.2);
  padding: 10px 16px;
  border-radius: 999px;
  text-decoration: none;
  color: #f5e6c8;
}

/* HERO */
.hero {
  text-align: center;
  padding: 50px 25px;
  border-radius: 26px;
  background: rgba(12,8,4,0.75);
  border: 1px solid rgba(212,175,55,0.2);
  margin-bottom: 22px;
}

.hero h1 {
  font-size: clamp(2rem,5vw,3.5rem);
  margin: 0 0 10px;
}

.headline {
  color: #f5d97a;
  font-size: 1.2rem;
}

/* PANELS */
.panel {
  background: rgba(12,8,4,0.72);
  border: 1px solid rgba(212,175,55,0.22);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 22px;
}

.section-title {
  text-align: center;
  color: #f5d97a;
  margin-bottom: 16px;
}

/* STORY */
.story-body {
  white-space: pre-wrap;
  line-height: 1.8;
}

/* STRUCTURED */
.struct-section {
  margin-top: 20px;
  border-top: 1px dashed rgba(212,175,55,0.2);
  padding-top: 15px;
}

.struct-title {
  color: #f5d97a;
  margin-bottom: 6px;
}

.struct-type {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 6px;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap: 16px;
}

.thumb img {
  width: 100%;
  border-radius: 12px;
  cursor: pointer;
}

/* LIGHTBOX */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
}

.lightbox.active { display: flex; }

</style>
</head>

<body>

<div class="wrap">

<div class="topbar">
  <div class="brand">MyStoryChip</div>
  <a id="editLink" class="edit-link">Edit</a>
</div>

<div id="content"></div>

</div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg">
</div>

<script>

const STORAGE_KEY = "mscChips";
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

const content = document.getElementById("content");
const editLink = document.getElementById("editLink");

if(code){
  editLink.href = "client-setup.html?code=" + code;
}

let chips = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
const chip = chips.find(c => c.code === code);

if(!chip){
  content.innerHTML = "<h2>Chip not found</h2>";
}else{

const sections = (chip.structuredSections || []).map(sec => `
  <div class="struct-section">
    <div class="struct-type">${sec.type || ""}</div>
    <div class="struct-title">${sec.title || ""}</div>
    <div>${sec.content || ""}</div>
  </div>
`).join("");

const images = (chip.images || []).map((img,i)=>`
  <div class="thumb" data-i="${i}">
    <img src="${img}">
  </div>
`).join("");

content.innerHTML = `
<div class="hero">
  <h1>${chip.title || "My Story"}</h1>
  <div class="headline">${chip.headline || ""}</div>
</div>

<div class="panel">
  <h2 class="section-title">The Story</h2>
  <div class="story-body">${chip.desc || ""}</div>
  ${sections}
</div>

<div class="panel">
  <h2 class="section-title">Photos</h2>
  <div class="gallery">${images}</div>
</div>
`;

}

/* LIGHTBOX */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

document.addEventListener("click", e=>{
  if(e.target.tagName==="IMG" && e.target.closest(".thumb")){
    lightbox.classList.add("active");
    lightboxImg.src = e.target.src;
  }
  if(e.target===lightbox){
    lightbox.classList.remove("active");
  }
});

</script>

</body>
</html>
