<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My StoryChip</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(rgba(6,6,6,0.68), rgba(6,6,6,0.90)),
        url("landing-page.png") center center / cover no-repeat fixed;
      color: #f5e6c8;
      padding: 24px;
      overflow-y: auto;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .brand {
      color: #d4af37;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
    }

    .edit-link {
      color: #f5e6c8;
      text-decoration: none;
      border: 1px solid rgba(245,230,200,0.22);
      padding: 10px 16px;
      border-radius: 999px;
      transition: all 0.2s ease;
      font-size: 15px;
      background: rgba(20,12,4,0.35);
    }

    .edit-link:hover {
      border-color: rgba(212,175,55,0.45);
      color: #fff;
      transform: translateY(-1px);
    }

    .hero,
    .story-panel,
    .gallery-panel,
    .credit-panel,
    .meta-panel,
    .message {
      background: rgba(12, 8, 4, 0.72);
      border: 1px solid rgba(212,175,55,0.22);
      border-radius: 26px;
      box-shadow:
        0 0 18px rgba(212,175,55,0.10),
        0 0 44px rgba(0,0,0,0.42);
      backdrop-filter: blur(2px);
    }

    .hero {
      text-align: center;
      padding: 44px 28px 40px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(245,217,122,0.18), transparent 36%),
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.10), transparent 28%);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      color: #f5d97a;
      font-size: 13px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 4.8vw, 4rem);
      line-height: 1.02;
      color: #f7ead0;
      text-shadow:
        0 0 10px rgba(212,175,55,0.14),
        0 0 28px rgba(0,0,0,0.7);
    }

    .headline {
      color: #f5d97a;
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 760px;
      margin: 0 auto 12px;
    }

    .hero-note {
      color: #d8c79c;
      font-size: 1rem;
      line-height: 1.7;
      max-width: 700px;
      margin: 0 auto;
    }

    .code-line {
      margin-top: 20px;
      color: #f5d97a;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .story-panel,
    .gallery-panel,
    .credit-panel,
    .meta-panel {
      padding: 28px 24px;
      margin-bottom: 22px;
    }

    .section-title {
      margin: 0 0 16px;
      color: #f5d97a;
      font-size: 1.55rem;
      letter-spacing: 0.3px;
      text-align: center;
    }

    .story-body {
      font-size: 1.18rem;
      line-height: 2;
      color: #f5e6c8;
      max-width: 820px;
      margin: 0 auto;
      white-space: pre-wrap;
      text-align: left;
    }

    .empty {
      color: #cdbb8f;
      font-style: italic;
      text-align: center;
    }

    .gallery-intro {
      text-align: center;
      color: #d8c79c;
      font-size: 1rem;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 18px;
    }

    .thumb {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.22);
      background: rgba(255,255,255,0.04);
      box-shadow:
        0 0 12px rgba(0,0,0,0.26),
        0 0 18px rgba(212,175,55,0.08);
      cursor: pointer;
      min-height: 170px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .thumb:hover {
      transform: translateY(-3px);
      box-shadow:
        0 0 16px rgba(0,0,0,0.28),
        0 0 22px rgba(212,175,55,0.14);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      min-height: 170px;
      object-fit: cover;
      display: block;
    }

    .thumb::after {
      content: "Tap to enlarge";
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(10,10,10,0.65);
      color: #f5d97a;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(245,217,122,0.16);
      backdrop-filter: blur(2px);
    }

    .credit-panel {
      text-align: center;
      background:
        linear-gradient(rgba(12,8,4,0.78), rgba(12,8,4,0.78)),
        radial-gradient(circle at 50% 0%, rgba(245,217,122,0.10), transparent 50%);
    }

    .credit-line {
      color: #e8dcc0;
      font-size: 1.08rem;
      line-height: 1.8;
    }

    .credit-line strong {
      color: #f5d97a;
      font-weight: normal;
    }

    .credit-sub {
      margin-top: 8px;
      color: #cdbb8f;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .meta-panel {
      text-align: center;
    }

    .meta-title {
      margin: 0 0 16px;
      color: #d8c79c;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .meta-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,175,55,0.14);
      border-radius: 16px;
      padding: 14px;
    }

    .meta-label {
      color: #f5d97a;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .meta-value {
      color: #f5e6c8;
      font-size: 1rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message {
      padding: 30px 24px;
      text-align: center;
    }

    .message h2 {
      margin-top: 0;
      color: #f5e6c8;
      font-size: 2rem;
    }

    .message p {
      color: #e8dcc0;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .message a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-panel {
      position: relative;
      width: 100%;
      max-width: 1280px;
      max-height: 92vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .lightbox-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-height: 92vh;
    }

    .lightbox img {
      display: block;
      max-width: 88vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      border: 1px solid rgba(212,175,55,0.25);
      box-shadow: 0 0 30px rgba(212,175,55,0.18);
      background: #111;
    }

    .lightbox-close,
    .lightbox-nav {
      border: 1px solid rgba(212,175,55,0.28);
      background: rgba(20,12,4,0.88);
      color: #f5d97a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-close {
      position: absolute;
      top: -10px;
      right: -2px;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      font-size: 22px;
      line-height: 1;
      z-index: 3;
    }

    .lightbox-nav {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      font-size: 26px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .lightbox-close:hover,
    .lightbox-nav:hover {
      color: #fff;
    }

    .lightbox-counter {
      position: absolute;
      bottom: -34px;
      left: 50%;
      transform: translateX(-50%);
      color: #d8c79c;
      font-size: 14px;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .meta-grid {
        grid-template-columns: 1fr;
      }

      .gallery {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      }

      .thumb,
      .thumb img {
        min-height: 130px;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .hero,
      .story-panel,
      .gallery-panel,
      .credit-panel,
      .meta-panel,
      .message {
        padding: 20px 16px;
        border-radius: 20px;
      }

      .headline,
      .hero-note,
      .story-body {
        font-size: 1rem;
      }

      .lightbox-panel {
        gap: 8px;
      }

      .lightbox-nav {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      .lightbox img {
        max-width: 76vw;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">MyStoryChip</div>
      <a id="editLinkTop" class="edit-link" href="client-setup.html">Edit This Chip</a>
    </div>

    <div id="chipContainer"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-panel">
      <button type="button" class="lightbox-nav" id="prevBtn" aria-label="Previous image">‹</button>

      <div class="lightbox-stage">
        <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close image viewer">×</button>
        <img id="lightboxImg" src="" alt="Expanded image">
        <div class="lightbox-counter" id="lightboxCounter"></div>
      </div>

      <button type="button" class="lightbox-nav" id="nextBtn" aria-label="Next image">›</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "mscChips";

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    const chipContainer = document.getElementById("chipContainer");
    const editLinkTop = document.getElementById("editLinkTop");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const lightboxCounter = document.getElementById("lightboxCounter");

    let galleryImages = [];
    let currentImageIndex = 0;

    function safeText(value) {
      return value && String(value).trim() ? String(value) : "";
    }

    function renderMissing(message) {
      chipContainer.innerHTML = `
        <div class="message">
          <h2>Chip Not Found</h2>
          <p>${message}</p>
          <a href="dashboard.html">Return to Dashboard</a>
        </div>
      `;
    }

    function updateLightboxImage() {
      if (!galleryImages.length) return;
      lightboxImg.src = galleryImages[currentImageIndex];
      lightboxCounter.textContent = `${currentImageIndex + 1} of ${galleryImages.length}`;
    }

    function openLightbox(index) {
      currentImageIndex = index;
      updateLightboxImage();
      lightbox.classList.add("active");
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
      lightboxImg.src = "";
    }

    function showPrevImage() {
      if (!galleryImages.length) return;
      currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
      updateLightboxImage();
    }

    function showNextImage() {
      if (!galleryImages.length) return;
      currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
      updateLightboxImage();
    }

    if (!code) {
      renderMissing("No chip code was found in the page link.");
    } else {
      editLinkTop.href = `client-setup.html?code=${encodeURIComponent(code)}`;

      let chips = [];
      try {
        chips = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (err) {
        chips = [];
      }

      const chip = chips.find(item => item && item.code === code);

      if (!chip) {
        renderMissing(`We could not find a saved chip with code ${code}.`);
      } else {
        const images = Array.isArray(chip.images) ? [...new Set(chip.images.filter(Boolean))] : [];
        galleryImages = images;

        const displayTitle = safeText(chip.title) || safeText(chip.name) || "My Story";
        const displayCode = safeText(chip.code) || "";
        const displayHeadline = safeText(chip.headline) || "A story worth remembering.";
        const displayDetails = safeText(chip.desc) || safeText(chip.description) || "";
        const displayCategory = safeText(chip.category) || "Not set";
        const displayType = safeText(chip.type) || "Personal";
        const displayStatus = safeText(chip.status) || "Saved";
        const creatorName = safeText(chip.fullName) || safeText(chip.name) || "a MyStoryChip customer";

        chipContainer.innerHTML = `
          <div class="hero">
            <div class="hero-inner">
              <div class="eyebrow">A Story Worth Sharing</div>
              <h1>${displayTitle}</h1>
              <div class="headline">${displayHeadline}</div>
              <div class="hero-note">
                Opened through MyStoryChip to preserve memories, meaning, and the story behind what matters.
              </div>
              <div class="code-line">Chip Code: ${displayCode}</div>
            </div>
          </div>

          <div class="story-panel">
            <h2 class="section-title">The Story</h2>
            <div class="story-body ${displayDetails ? "" : "empty"}">
              ${displayDetails ? displayDetails : "No story details have been added yet."}
            </div>
          </div>

          <div class="gallery-panel">
            <h2 class="section-title">Memories & Moments</h2>
            ${
              images.length
                ? `
                  <div class="gallery-intro">
                    Tap any photo to enlarge and move through the gallery.
                  </div>
                  <div class="gallery">
                    ${images.map((src, index) => `
                      <div class="thumb" data-index="${index}">
                        <img src="${src}" alt="Story photo ${index + 1}">
                      </div>
                    `).join("")}
                  </div>
                `
                : `<div class="empty">No photos have been added yet.</div>`
            }
          </div>

          <div class="credit-panel">
            <div class="credit-line">
              Created and shared by <strong>${creatorName}</strong>
            </div>
            <div class="credit-sub">
              through MyStoryChip
            </div>
          </div>

          <div class="meta-panel">
            <div class="meta-title">Chip Information</div>
            <div class="meta-grid">
              <div class="meta-box">
                <div class="meta-label">Category</div>
                <div class="meta-value">${displayCategory}</div>
              </div>
              <div class="meta-box">
                <div class="meta-label">Type</div>
                <div class="meta-value">${displayType}</div>
              </div>
              <div class="meta-box">
                <div class="meta-label">Status</div>
                <div class="meta-value">${displayStatus}</div>
              </div>
            </div>
          </div>
        `;

        document.querySelectorAll(".thumb").forEach((thumb) => {
          thumb.addEventListener("click", () => {
            openLightbox(Number(thumb.getAttribute("data-index")));
          });
        });
      }
    }

    lightboxClose.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", showPrevImage);
    nextBtn.addEventListener("click", showNextImage);

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("active")) return;

      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showPrevImage();
      if (e.key === "ArrowRight") showNextImage();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseUrl = "https://ulbmdqwavkphcnjgrchd.supabase.co";

const supabase = supabase.createClient(supabaseUrl, supabaseKey);
</script>
</body>
</html>
