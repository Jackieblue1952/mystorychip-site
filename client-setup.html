<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Up Your MyStoryChip</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Georgia, serif;
  color: #3a2a12;
  background:
    radial-gradient(circle at top center, rgba(255, 219, 132, 0.42), transparent 38%),
    linear-gradient(180deg, #fff8ec 0%, #f2e2c4 58%, #e7c98e 100%);
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.85);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 { text-align:center; }

input, textarea, select {
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:12px;
  border:1px solid #caa65a;
}

button {
  padding:14px;
  border-radius:999px;
  border:none;
  background:linear-gradient(#ffe39a,#d4a447);
  font-weight:bold;
  cursor:pointer;
}

/* NEW PHOTO GRID */
.photo-grid {
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  margin-top:16px;
}

.photo-card {
  width:140px;
  background:#fff;
  border-radius:16px;
  padding:10px;
  box-shadow:0 6px 20px rgba(0,0,0,0.15);
}

.photo-card img {
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:10px;
}

.photo-card select {
  margin-top:6px;
  font-size:12px;
}

.remove-btn {
  background:#222;
  color:white;
  border:none;
  border-radius:999px;
  width:24px;
  height:24px;
  float:right;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Build Your Chip Page</h1>

<div class="card">
<label>Page Title</label>
<input id="title">

<label>Your Name</label>
<input id="name">

<label>Phone</label>
<input id="phone">

<label>PIN</label>
<input id="pin" maxlength="4">

<label>Confirm PIN</label>
<input id="pin2" maxlength="4">
</div>

<div class="card">
<label>Story</label>
<textarea id="desc"></textarea>
</div>

<div class="card">
<h3>Upload Photos</h3>

<input type="file" id="files" multiple accept="image/*">

<div id="photoGrid" class="photo-grid"></div>

</div>

<div class="card">
<button id="saveBtn">Save My Chip</button>
</div>

<script>

const STORAGE_KEY = "mscChips";
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

let chips = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let chip = chips.find(c=>c.code===code) || {code, images:[]};

let workingImages = chip.images || [];

/* ===== IMAGE LOAD ===== */

document.getElementById("files").addEventListener("change", async (e)=>{

  const files = Array.from(e.target.files);

  for(const file of files){

    const base64 = await resizeImage(file);

    workingImages.push({
      src: base64,
      visibility: "public"
    });

  }

  renderPhotos();
});

/* ===== RESIZE ===== */

function resizeImage(file){
  return new Promise(resolve=>{
    const reader = new FileReader();

    reader.onload = (e)=>{
      const img = new Image();

      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        let width = img.width;
        let height = img.height;

        if(width>1000){
          height *= 1000/width;
          width = 1000;
        }

        canvas.width = width;
        canvas.height = height;

        ctx.drawImage(img,0,0,width,height);

        resolve(canvas.toDataURL("image/jpeg",0.6));
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

/* ===== RENDER ===== */

function renderPhotos(){

  const grid = document.getElementById("photoGrid");
  grid.innerHTML="";

  workingImages.forEach((imgObj,index)=>{

    // BACKWARD COMPATIBILITY
    if(typeof imgObj === "string"){
      imgObj = {src:imgObj, visibility:"public"};
      workingImages[index] = imgObj;
    }

    const card = document.createElement("div");
    card.className="photo-card";

    card.innerHTML = `
      <button class="remove-btn">×</button>
      <img src="${imgObj.src}">
      <select>
        <option value="public">Public</option>
        <option value="private">Private</option>
        <option value="both">Both</option>
        <option value="undecided">Later</option>
      </select>
    `;

    const select = card.querySelector("select");
    select.value = imgObj.visibility || "public";

    select.onchange = ()=>{
      imgObj.visibility = select.value;
    };

    card.querySelector(".remove-btn").onclick = ()=>{
      workingImages.splice(index,1);
      renderPhotos();
    };

    grid.appendChild(card);
  });

}

/* ===== SAVE ===== */

document.getElementById("saveBtn").onclick = ()=>{

  const title = document.getElementById("title").value;
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const pin = document.getElementById("pin").value;
  const pin2 = document.getElementById("pin2").value;

  if(pin!==pin2){
    alert("PIN mismatch");
    return;
  }

  chip.title = title;
  chip.name = name;
  chip.phone = phone;
  chip.pin = pin;
  chip.desc = document.getElementById("desc").value;
  chip.images = workingImages;

  const index = chips.findIndex(c=>c.code===code);

  if(index>-1) chips[index]=chip;
  else chips.push(chip);

  localStorage.setItem(STORAGE_KEY, JSON.stringify(chips));

  window.location.href = `success.html?code=${code}`;
};

/* ===== INIT ===== */

renderPhotos();

</script>

</body>
</html>
