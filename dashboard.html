<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip Control Center</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7e3b8;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.section {
  background: #fff;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 10px;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 10px;
}

button {
  padding: 10px 15px;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  border: 1px solid #ccc;
  padding: 8px;
}
</style>
</head>

<body>

<h1>MyStoryChip Control Center</h1>

<div class="section">
<h2>Add Chip</h2>

<input id="code" placeholder="Chip Code">
<select id="type">
  <option>Paid</option>
  <option>Demo</option>
  <option>Test</option>
</select>

<select id="status">
  <option>Available</option>
  <option>Assigned</option>
  <option>Live</option>
</select>

<input id="name" placeholder="Customer Name">
<input id="email" placeholder="Customer Email">
<textarea id="notes" placeholder="Notes"></textarea>

<button onclick="addChip()">Add Chip</button>
</div>

<div class="section">
<h2>Chip Registry</h2>
<table>
<thead>
<tr>
<th>Code</th>
<th>Type</th>
<th>Status</th>
<th>Name</th>
<th>Email</th>
</tr>
</thead>
<tbody id="chipsTable"></tbody>
</table>
</div>

<div class="section">
<h2>Tax Notes</h2>
<textarea id="taxNote"></textarea>
<button onclick="addNote()">Save Note</button>

<ul id="notesList"></ul>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://ulbmdqwavkphcnjgrchd.supabase.co",
  "sb_publishable_xdy7N3s-1sQLo9vPe70OFQ_VTLS8BjQ"
);

async function addChip() {
  const { error } = await supabase
    .from('chips')
    .insert([{
      code: document.getElementById("code").value,
      type: document.getElementById("type").value,
      status: document.getElementById("status").value,
      customer_name: document.getElementById("name").value,
      customer_email: document.getElementById("email").value,
      notes: document.getElementById("notes").value
    }]);

  if (error) {
    alert("Error: " + error.message);
  } else {
    alert("Chip saved!");
    loadChips();
  }
}

async function loadChips() {
  const { data, error } = await supabase
    .from('chips')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  const table = document.getElementById("chipsTable");
  table.innerHTML = "";

  data.forEach(chip => {
    table.innerHTML += `
      <tr>
        <td>${chip.code}</td>
        <td>${chip.type}</td>
        <td>${chip.status}</td>
        <td>${chip.customer_name || ''}</td>
        <td>${chip.customer_email || ''}</td>
      </tr>
    `;
  });
}

async function addNote() {
  const note = document.getElementById("taxNote").value;

  const { error } = await supabase
    .from('tax_notes')
    .insert([{ note }]);

  if (error) {
    alert(error.message);
  } else {
    document.getElementById("taxNote").value = "";
    loadNotes();
  }
}

async function loadNotes() {
  const { data } = await supabase
    .from('tax_notes')
    .select('*')
    .order('created_at', { ascending: false });

  const list = document.getElementById("notesList");
  list.innerHTML = "";

  data.forEach(n => {
    list.innerHTML += `<li>${n.note}</li>`;
  });
}

loadChips();
loadNotes();
</script>

</body>
</html>
