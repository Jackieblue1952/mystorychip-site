<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStoryChip — Tap Into the Story Behind Anything</title>
<meta name="description" content="MyStoryChip connects real-world objects to a living digital story. Tap once to share memories, information, and meaning — instantly." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
  width: 100%;
  height: 100%;
  background: #0a0a0a;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5d8a2;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at center, rgba(212, 175, 55, 0.12), transparent 55%)
        linear-gradient(to bottom, #0a0a0a 0%, #050505 100%);
      overflow: hidden;
    }

    .poster-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .poster {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  display: block;

  filter:
    drop-shadow(0 0 20px rgba(212, 175, 55, 0.18))
    drop-shadow(0 0 50px rgba(212, 175, 55, 0.10));

  user-select: none;
  -webkit-user-drag: none;
}

 .hotspot {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: block;
  text-indent: -9999px;
  overflow: hidden;
  white-space: nowrap;
  border-radius: 999px;
  transition: none;
  cursor: pointer;
  z-index: 5;
}

   .hotspot:hover {
  transform: translateX(-50%);
} 

    .story-hotspot {
  top: 73.2%;
  width: min(28vw, 380px);
  height: min(5.8vw, 80px);
  background: transparent;
  box-shadow: none;
}

.story-hotspot,
.enter-hotspot {
  background: transparent !important;
  box-shadow: none !important;
  border: none !important;
}

.enter-hotspot {
  top: 91.7%;
  width: 28vw;
  height: 6vw;
  background: rgba(255, 190, 80, 0.10);
  box-shadow: 0 0 12px rgba(255, 170, 60, 0.22);
  animation: breatheGlow 2.2s ease-in-out infinite;
}
.hotspot {
  cursor: pointer;
}
.story-hotspot:hover {
  background: rgba(255, 210, 120, 0.03);
  box-shadow: none;
}

    .enter-hotspot {
      top: 92%;
      width: min(14vw, 190px);
      height: min(3.4vw, 48px);
      background: rgba(255, 180, 70, 0.03);
      box-shadow:
        0 0 0 1px rgba(255, 214, 145, 0.08),
        0 0 12px rgba(255, 170, 70, 0.10);
    }

    .enter-hotspot:hover {
  background: rgba(255, 210, 120, 0.03);
  box-shadow: none;
}

    @media (max-aspect-ratio: 4/3) {
      .story-hotspot {
        top: 72.8%;
        width: 40vw;
        height: 6.8vw;
      }

      .enter-hotspot {
        top: 91.3%;
        width: 20vw;
        height: 4.4vw;
      }
    }

    @media (max-width: 900px) {
      .poster-wrap {
        padding: 8px;
      }

      .poster img {
        object-fit: contain;
      }

      .story-hotspot {
        top: 72.5%;
        width: 44vw;
        height: 7.2vw;
      }

      .enter-hotspot {
        top: 91%;
        width: 22vw;
        height: 4.8vw;
      }
    }

    @media (max-width: 640px) {
      html, body {
        overflow: auto;
      }

      .page {
        min-height: 100vh;
        height: auto;
      }

      .poster-wrap {
        position: relative;
        min-height: 100vh;
        padding: 10px;
      }

      .poster {
        min-height: 100vh;
      }

      .poster img {
        width: 100%;
        height: auto;
        max-height: none;
        position: relative;
        z-index: 1;
      }

      .story-hotspot {
        top: 73%;
        width: 52vw;
        height: 9vw;
      }

      .enter-hotspot {
  top: 91.7%;
  width: 28vw;
  height: 6vw;
  background: rgba(255, 0, 0, 0.35);
  z-index: 20;
}
@keyframes breatheGlow {
  0% {
    background: rgba(255, 190, 80, 0.04);
    box-shadow: 0 0 6px rgba(255, 170, 60, 0.10);
  }
  50% {
    background: rgba(255, 210, 110, 0.16);
    box-shadow: 0 0 22px rgba(255, 175, 60, 0.34);
  }
  100% {
    background: rgba(255, 190, 80, 0.04);
    box-shadow: 0 0 6px rgba(255, 170, 60, 0.10);
  }
.entry-link {
  position: absolute;
  left: 50%;
  bottom: 2.2%;
  transform: translateX(-50%);
  z-index: 30;
  color: #f3d7a3;
  text-decoration: none;
  font-size: 1.15rem;
  letter-spacing: 0.08em;
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(25, 10, 5, 0.45);
  border: 1px solid rgba(255, 210, 130, 0.35);
  box-shadow: 0 0 14px rgba(255, 170, 60, 0.18);
}

.entry-link:hover {
  color: #fff2d2;
  border-color: rgba(255, 225, 170, 0.7);
  box-shadow: 0 0 18px rgba(255, 180, 70, 0.28);
}
}
  </style>
</head>
<body>
  <main class="page">
    <div class="poster-wrap">
      <div class="poster">
     <img src="landing-page.png" alt="MyStoryChip landing artwork" />  

        <a class="hotspot story-hotspot" href="story.html">The MyStoryChip Story</a>
        <a class="hotspot enter-hotspot" href="story.html">Tap to Enter</a>
<a class="entry-link" href="story.html">Enter Here</a>
      </div>
    </div>
