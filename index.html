<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyStoryChip — Tap Into the Story Behind Anything</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  font-family: Georgia, "Times New Roman", serif;
  overflow: hidden;
}

/* LAYOUT */
.page {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.poster-wrap {
  position: relative;
  width: 100%;
  height: 100%;
}

.poster {
  position: relative;
  width: 100%;
  height: 100%;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;

  filter:
    drop-shadow(0 0 20px rgba(212,175,55,0.18))
    drop-shadow(0 0 50px rgba(212,175,55,0.10));
}

/* ADMIN BUTTON */
.admin-btn {
  position: absolute;
  top: 18px;
  right: 18px;

  padding: 6px 14px;
  font-size: 0.8rem;
  letter-spacing: 0.08em;

  color: #f5e6c8;
  text-decoration: none;

  background: rgba(212,175,55,0.10);
  border: 1px solid rgba(212,175,55,0.35);
  border-radius: 999px;

  backdrop-filter: blur(4px);

  box-shadow: 0 0 10px rgba(212,175,55,0.15);

  transition: all 0.25s ease;
  z-index: 10000;
}

.admin-btn:hover {
  background: rgba(212,175,55,0.18);
  box-shadow:
    0 0 14px rgba(245,217,122,0.25),
    0 0 28px rgba(212,175,55,0.18);
}

/* DISCLAIMER */
.disclaimer-text {
  position: absolute;
  bottom: 10px;
  width: 100%;
  text-align: center;

  font-size: 0.65rem;
  color: rgba(232,220,192,0.6);
}

/* CHIP HOTSPOT */
.story-hotspot {
  position: absolute;
  left: 50%;
  top: 56%;
  transform: translate(-50%, -50%);

  width: 7vw;
  height: 7vw;
  max-width: 90px;
  max-height: 90px;
  min-width: 52px;
  min-height: 52px;

  border-radius: 12px;
  z-index: 9999;
  cursor: pointer;
border: 1px solid rgba(212,175,55,0.35);
  background: radial-gradient(
  ellipse at center,
    rgba(255,215,120,0.28) 0%,
    rgba(212,175,55,0.18) 35%,
    rgba(212,175,55,0.05) 60%,
    rgba(212,175,55,0.00) 75%
  );

  box-shadow:
    0 0 18px rgba(255,215,120,0.35),
    0 0 40px rgba(212,175,55,0.25);

  animation: chipPulse 10s ease-in-out infinite;
}
  .chip-hint {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);

  font-size: 0.7rem;
  letter-spacing: 0.12em;
  color: rgba(245,230,200,0.75);

  pointer-events: none;

  opacity: 0;
  animation: hintFade 3.5s ease-in-out infinite;

  z-index: 9999;
}

/* HOVER */
.story-hotspot:hover {
  box-shadow:
    0 0 28px rgba(255,230,150,0.55),
    0 0 60px rgba(212,175,55,0.35);
}

/* ANIMATION */
@keyframes chipPulse {
  0% {
    transform: translate(-50%, -50%) scale(0.96);
  }

  50% {
    transform: translate(-50%, -50%) scale(1.06);
  }

  100% {
    transform: translate(-50%, -50%) scale(0.96);
  }
  @keyframes hintFade {
  0%   { opacity: 0; transform: translate(-50%, -60%); }
  30%  { opacity: 0.7; }
  70%  { opacity: 0.7; }
  100% { opacity: 0; transform: translate(-50%, -70%); }
}
}

}
</style>
</head>

<body>

<div class="page">
  <div class="poster-wrap">
    <div class="poster">

      <!-- IMAGE -->
      <img src="landing-page.png" alt="MyStoryChip">

      <!-- ADMIN -->
      <a href="admin.html" class="admin-btn">Admin</a>

      <!-- DISCLAIMER -->
      <div class="disclaimer-text">
        By using this site, you agree to our Terms & Disclaimer
      </div>

      <!-- CLICKABLE CHIP -->
      <a href="story.html" class="story-hotspot" aria-label="Open The MyStoryChip Story"></a>
<div class="chip-hint">Tap the chip</div>
    </div>
  </div>
</div>

</body>
</html>
