<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  color:  #e6d3a3;
  text-align: center;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.9)),
    url("landing-page.png") center center / cover no-repeat fixed;
}

/* MAIN WRAP */
.wrap {
  padding: 80px 20px;
  max-width: 900px;
  margin: auto;
}

/* BRAND */
.brand {
  font-size: 20px;
  letter-spacing: 2px;
  color: #d4af37;
  margin-bottom: 10px;
}

/* TAGLINE */
.tagline {
  font-size: 14px;
  color: #e6d3a3;
  margin-bottom: 30px;
}

/* HEADLINE */
h1 {
  font-size: 30px;
  margin: 10px 0;
  line-height: 1.3;
  letter-spacing: 1px;
  color: #f5e6c8;
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
}

/* SUBLINE */
.subline {
  margin-top: 10px;
  font-size: 16px;
  color: #e6d3a3;
}

/* DESCRIPTION */
.desc {
  margin-top: 25px;
  font-size: 18px;
  line-height: 1.6;
}

/* BUTTON */
.btn {
  display: inline-block;
  margin-top: 40px;
  padding: 16px 28px;
  background: #d4af37;
  color: #111;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  font-size: 18px;
  box-shadow: 0 0 20px rgba(212,175,55,0.4);
}

.btn:hover {
  background: #f5d97a;
}

/* FOOTER */
.footer {
  margin-top: 80px;
  font-size: 12px;
  color: #cdbb8f;
}
 .hero {
  position: relative;
  padding-top: 120px;
  z-index: 2;
}

.hero-glow {
  position: absolute;
  top: 35%;
  left: 50%;
  width: 500px;
  height: 500px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, rgba(0,0,0,0) 70%);
  filter: blur(40px);
  animation: pulseGlow 4s ease-in-out infinite;
  z-index: 0;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
}

.cta-btn {
  display: inline-block;
  margin-top: 30px;
  padding: 14px 32px;
  border: 1px solid #d4af37;
  color: #f5e6c8;
  background: transparent;
  border-radius: 30px;
  text-decoration: none;
  transition: all 0.3s ease;
}

.cta-btn:hover {
  background: #d4af37;
  color: #0a0a0a;
  box-shadow: 0 0 20px rgba(212,175,55,0.6);
} 
</style>
</head>

<body>

<div class="hero">

  <div class="hero-glow"></div>

  <div class="brand">MyStoryChip</div>
  <div class="tagline">YOUR CHIP. YOUR STORY.</div>

  <h1>Tap the chip.<br>Discover the story.</h1>

  <div class="tagline" style="font-style: italic; font-size: 18px; margin-top:15px;">
    Every object has a story… now it can be told.
  </div>

  <p>Attach a MyStoryChip to anything.</p>
  <p>Tap your phone to instantly open its story, photos, or history.</p>

  <p style="margin-top:15px; font-size:0.95rem; color:#cbb88a;">
    No apps. No subscriptions. Just tap and open.
  </p>

  <a href="buy.html" class="cta-btn">Begin Your Story</a>

</div>

</body>
</html>
