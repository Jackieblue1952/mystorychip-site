<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyStoryChip — Tap Into the Story Behind Anything</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  font-family: Georgia, "Times New Roman", serif;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f5e6c8;
}

.page {
  position: relative;
  width: 100vw;
  height: 100vh;
  background:
    radial-gradient(circle at center, rgba(212,175,55,0.12), transparent 55%),
    linear-gradient(to bottom, #0a0a0a, #050505);
}

/* ===== POSTER ===== */

.poster-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.poster {
  position: relative;
  width: 100%;
  height: 100%;
}

/* DARK OVERLAY */
.poster::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 1;
}

/* IMAGE */
.poster img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter:
    drop-shadow(0 0 20px rgba(212,175,55,0.18))
    drop-shadow(0 0 50px rgba(212,175,55,0.10));
}

/* ===== STORY HOTSPOT (MAIN ENTRY) ===== */

.story-hotspot {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 73%;
  width: min(28vw, 380px);
  height: min(5.8vw, 80px);

  z-index: 5;
  cursor: pointer;
}

/* TAP LABEL */
.tap-label {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(73% - 3.5vw);

  font-size: 1rem;
  letter-spacing: 0.08em;
  color: #f5e6c8;

  padding: 6px 16px;
  border-radius: 999px;

  background: rgba(212,175,55,0.06);
  border: 1px solid rgba(212,175,55,0.35);

  box-shadow: 0 0 14px rgba(212,175,55,0.18);

  animation: labelPulse 2.5s ease-in-out infinite;
}

/* SUBTLE GLOW ON BOOK */
@keyframes storyGlow {
  0% { box-shadow: 0 0 6px rgba(212,175,55,0.08); }
  50% { box-shadow: 0 0 16px rgba(212,175,55,0.20); }
  100% { box-shadow: 0 0 6px rgba(212,175,55,0.08); }
}

.story-hotspot:hover {
  box-shadow: 0 0 25px rgba(212,175,55,0.25);
}

/* LABEL PULSE */
@keyframes labelPulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}

/* MOBILE */
@media (max-width: 900px) {
  .story-hotspot {
    top: 72.5%;
    width: 44vw;
    height: 7.2vw;
  }

  .tap-label {
    top: calc(72.5% - 6vw);
    font-size: 0.9rem;
  }
}

@media (max-width: 640px) {
  html, body {
    overflow: auto;
  }

  .page {
    height: auto;
    min-height: 100vh;
  }

  .poster-wrap {
    position: relative;
    padding: 10px;
  }

  .poster img {
    height: auto;
  }

  .story-hotspot {
    top: 73%;
    width: 52vw;
    height: 9vw;
  }

  .tap-label {
    top: calc(73% - 8vw);
  }
}
</style>
</head>

<body>

<div class="page">
  <div class="poster-wrap">
    <div class="poster">

      <!-- IMAGE -->
      <img src="landing-page.png" alt="MyStoryChip">
      <div class="disclaimer-text">By using this site, you agree to our Terms &amp; Disclaimer</div>

      <!-- TAP LABEL -->
      <div class="tap-label">Tap Here</div>

      <!-- CLICK AREA -->
      <a href="story.html" class="story-hotspot"></a>

    </div>
  </div>
</div>

</body>
</html>
