<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStoryChip — Tap Into the Story Behind Anything</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050505;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .page,
    .poster-wrap,
    .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      pointer-events: none;
      user-select: none;
      filter:
        drop-shadow(0 0 18px rgba(212,175,55,0.18))
        drop-shadow(0 0 42px rgba(212,175,55,0.10));
    }

    /* ADMIN BUTTON (leave it alone) */
    .admin-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10000;
      padding: 7px 15px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f5e6c8;
      text-decoration: none;
      background: rgba(212,175,55,0.10);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 999px;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(212,175,55,0.15);
    }

    /* INVISIBLE CLICK AREA (THE CHIP) */
    .story-hotspot {
      position: absolute;
      left: 50%;
      top: 61%;
      transform: translate(-50%, -50%);
      width: 7vw;
      height: 7vw;
      max-width: 100px;
      max-height: 100px;
      min-width: 60px;
      min-height: 60px;
      border-radius: 14px;
      z-index: 9999;
      cursor: pointer;

      background: radial-gradient(
        ellipse at center,
        rgba(255,220,140,0.35) 0%,
        rgba(212,175,55,0.18) 40%,
        rgba(212,175,55,0.05) 65%,
        rgba(212,175,55,0.00) 80%
      );

      box-shadow:
        0 0 28px rgba(255,220,140,0.45),
        0 0 60px rgba(212,175,55,0.35);

      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.92); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }

    /* TAP TEXT (clean + subtle red) */
    .tap-text {
      position: absolute;
      left: 50%;
      top: 61%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      pointer-events: none;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      color: rgba(200, 60, 40, 0.95);

      text-shadow:
        0 0 10px rgba(200, 60, 40, 0.7),
        0 0 18px rgba(0,0,0,0.85);
    }

  </style>
</head>

<body>
  <div class="page">
    <div class="poster-wrap">
      <div class="poster">

        <img src="landing-page.png" alt="MyStoryChip landing page" />

        <a href="admin.html" class="admin-btn">Admin</a>

      <a href="story-new.html" class="story-hotspot"></a>

        <div class="tap-text">TAP</div>

      </div>
    </div>
  </div>
</body>
</html>
