<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>
body {
  margin: 0;
  background: #0a0a0a;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}
  .hero-wrap {
  width: 100%;
  max-width: 1600px;
  position: relative;
}

.hero-button {
  position: absolute;
  left: 7.8%;
  top: 74.5%;
  width: 29%;
  height: 9.5%;
  display: block;
  border-radius: 40px;
  cursor: pointer;
}

.hero-image {
  display: block;
  width: 100%;
  height: auto;
}

/* DARK OVERLAY FOR READABILITY */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 55%;
  height: 100%;
  background: linear-gradient(to right, rgba(0,0,0,0.95), rgba(0,0,0,0.4), transparent);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px;
}

/* BRAND */
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.brand img {
  width: 80px;
}

.brand span {
  font-size: 32px;
  color: #f5d97a;
  font-weight: bold;
}

/* HEADLINE */
h1 {
  font-size: 56px;
  margin: 10px 0;
}

.sub {
  font-size: 20px;
  margin-bottom: 25px;
}

.highlight {
  color: #f5d97a;
}

/* ICON ROW */
.icons {
  display: flex;
  gap: 40px;
  margin: 25px 0;
}

.icon {
  text-align: center;
  font-size: 14px;
}

/* BUTTON */
.cta {
  background: #d4af37;
  color: black;
  padding: 16px 28px;
  border-radius: 30px;
  font-size: 18px;
  width: fit-content;
  cursor: pointer;
  transition: 0.3s;
}

.cta:hover {
  box-shadow: 0 0 20px rgba(212,175,55,0.6);
}

/* PERKS BAR */
.perks {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: space-around;
  padding: 20px 10px;
  font-size: 14px;
}

.perk {
  text-align: center;
}
</style>
</head>

<body>

<div class="hero-wrap">
  <img src="landing-image.png" alt="MyStoryChip Landing Page" class="hero-image">
  <a href="buy.html" class="hero-button" aria-label="Start Your Story"></a>
</div>

</div>

</body>
</html>
