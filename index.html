<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyStoryChip — Tap Into the Story Behind Anything</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  font-family: Georgia, "Times New Roman", serif;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f5e6c8;
}

.page {
  position: relative;
  width: 100vw;
  height: 100vh;
  background:
    radial-gradient(circle at center, rgba(212,175,55,0.12), transparent 55%),
    linear-gradient(to bottom, #0a0a0a, #050505);
}

/* ===== POSTER ===== */

.poster-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.poster {
  position: relative;
  width: 100%;
  height: 100%;
}



/* IMAGE */
.poster img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter:
    drop-shadow(0 0 20px rgba(212,175,55,0.18))
    drop-shadow(0 0 50px rgba(212,175,55,0.10));
}

/* ===== STORY HOTSPOT (MAIN ENTRY) ===== */

.story-hotspot {
  position: absolute;
  left: 50%;
  top: 61.5%;
  transform: translate(-50%, -50%);

  width: 7vw;
  height: 7vw;
  max-width: 84px;
  max-height: 84px;
  min-width: 48px;
  min-height: 48px;

  border-radius: 50%;
  z-index: 9999;
  cursor: pointer;

  background: radial-gradient(
    circle,
    rgba(245,217,122,0.18) 0%,
    rgba(212,175,55,0.10) 35%,
    rgba(212,175,55,0.00) 70%
  );

  box-shadow:
    0 0 12px rgba(212,175,55,0.20),
    0 0 28px rgba(212,175,55,0.14);

  animation: chipPulse 2.2s ease-in-out infinite;
}

@keyframes chipPulse {
  0% {
    transform: translate(-50%, -50%) scale(0.96);
    box-shadow:
      0 0 10px rgba(212,175,55,0.16),
      0 0 22px rgba(212,175,55,0.10);
  }

  50% {
    transform: translate(-50%, -50%) scale(1.06);
    box-shadow:
      0 0 18px rgba(245,217,122,0.28),
      0 0 36px rgba(212,175,55,0.18);
  }

  100% {
    transform: translate(-50%, -50%) scale(0.96);
    box-shadow:
      0 0 10px rgba(212,175,55,0.16),
      0 0 22px rgba(212,175,55,0.10);
  }
}

/* SUBTLE GLOW ON BOOK */
@keyframes storyGlow {
  0% { box-shadow: 0 0 6px rgba(212,175,55,0.08); }
  50% { box-shadow: 0 0 16px rgba(212,175,55,0.20); }
  100% { box-shadow: 0 0 6px rgba(212,175,55,0.08); }
}

.story-hotspot:hover {
  box-shadow:
    0 0 18px rgba(245,217,122,0.30),
    0 0 36px rgba(212,175,55,0.22);
}
}

/* LABEL PULSE */
@keyframes labelPulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}

/* MOBILE */
@media (max-width: 900px) {
  .story-hotspot {
    top: 72.5%;
    width: 44vw;
    height: 7.2vw;
  }

  .tap-label {
    top: calc(72.5% - 6vw);
    font-size: 0.9rem;
  }
}

@media (max-width: 640px) {
  html, body {
    overflow: auto;
  }

  .page {
    height: auto;
    min-height: 100vh;
  }

  .poster-wrap {
    position: relative;
    padding: 10px;
  }

 .poster img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 1;
  pointer-events: none;
} 

  .story-hotspot {
    top: 73%;
    width: 52vw;
    height: 9vw;
  }

}
</style>
</head>

<body>

<div class="page">
  <div class="poster-wrap">
    <div class="poster">
<!-- IMAGE -->
<img src="landing-page.png" alt="MyStoryChip">

<a href="admin.html" class="admin-btn">Admin</a>

<div class="disclaimer-text">
  By using this site, you agree to our Terms &amp; Disclaimer
</div>

<a href="story.html" aria-label="Open The MyStoryChip Story" style="position:absolute; left:50%; transform:translateX(-50%); top:68.5%; z-index:9999; display:flex; align-items:center; justify-content:center; width:150px; height:36px; background:rgba(255,0,0,0.35); border:2px solid yellow; border-radius:999px; color:#f5e6c8; text-decoration:none; font-size:14px;">Tap Here</a>
      
     

    </div>
  </div>
</div>

</body>
</html>
