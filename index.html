<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStoryChip — Tap Into the Story Behind Anything</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050505;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .page,
    .poster-wrap,
    .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      pointer-events: none;
      user-select: none;
      filter:
        drop-shadow(0 0 18px rgba(212, 175, 55, 0.18))
        drop-shadow(0 0 42px rgba(212, 175, 55, 0.10));
    }

    .admin-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10000;
      padding: 7px 15px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f5e6c8;
      text-decoration: none;
      background: rgba(212, 175, 55, 0.10);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 999px;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
      transition: all 0.25s ease;
    }

    .admin-btn:hover {
      background: rgba(212, 175, 55, 0.18);
      box-shadow:
        0 0 14px rgba(245, 217, 122, 0.25),
        0 0 28px rgba(212, 175, 55, 0.18);
    }

   

    .hero-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }

    .disclaimer-text {
      display: none;
    }

    .story-hotspot {
      position: absolute;
      left: 50%;
      top: 36%;
      transform: translate(-50%, -50%);
      width: 7vw;
      height: 7vw;
      max-width: 92px;
      max-height: 92px;
      min-width: 52px;
      min-height: 52px;
      border-radius: 14px;
      z-index: 9999;
      cursor: pointer;
      border: 1px solid rgba(212, 175, 55, 0.38);
      background: radial-gradient(
        ellipse at center,
        rgba(255, 215, 120, 0.25) 0%,
        rgba(212, 175, 55, 0.14) 35%,
        rgba(212, 175, 55, 0.04) 60%,
        rgba(212, 175, 55, 0.00) 76%
      );
      box-shadow:
        0 0 16px rgba(255, 215, 120, 0.28),
        0 0 32px rgba(212, 175, 55, 0.18);
      animation: chipPulse 1.9s ease-in-out infinite;
    }

    .story-hotspot:hover {
      box-shadow:
        0 0 24px rgba(255, 230, 150, 0.42),
        0 0 48px rgba(212, 175, 55, 0.28);
    }

    @keyframes chipPulse {
      0%   { transform: translate(-50%, -50%) scale(0.92); }
      45%  { transform: translate(-50%, -50%) scale(1.15); }
      100% { transform: translate(-50%, -50%) scale(0.92); }
    }

    @media (max-width: 1100px) {
      .story-btn {
        min-width: 290px;
        padding: 16px 34px;
      }
    }

    @media (max-width: 820px) {
      .left-overlay {
        left: 50%;
        top: 76%;
        transform: translate(-50%, -50%);
      }

      

      .admin-btn {
        top: 12px;
        right: 12px;
      }

      .story-hotspot {
        top: 36%;
      }
    }

    @media (max-width: 560px) {
      .left-overlay {
        left: 50%;
        top: 76%;
        transform: translate(-50%, -50%);
      }

      

      .story-hotspot {
        width: 15vw;
        height: 15vw;
        min-width: 52px;
        min-height: 52px;
        max-width: 78px;
        max-height: 78px;
        top: 36%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="poster-wrap">
      <div class="poster">
        <img src="landing-page.png" alt="MyStoryChip landing page" />

        <a href="admin.html" class="admin-btn">Admin</a>

      
        <div class="disclaimer-text">
          By using this site, you agree to our Terms & Disclaimer
        </div>
    </div>
  </div>
</body>
</html>
