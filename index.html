<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  color: #e6d3a3;
  text-align: center;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.9)),
    url("landing-page.png") center center / cover no-repeat fixed;
}

/* MAIN WRAP */
.wrap {
  padding: 80px 20px;
  max-width: 900px;
  margin: auto;
}

/* BRAND */
.brand {
  font-size: 20px;
  letter-spacing: 2px;
  color: #d4af37;
  margin-bottom: 10px;
}

/* TAGLINE */
.tagline {
  font-size: 14px;
  color: #e6d3a3;
  margin-bottom: 30px;
}

/* HEADLINE */
h1 {
  font-size: 30px;
  margin: 10px 0;
  line-height: 1.3;
  letter-spacing: 1px;
  color: #f5e6c8;
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
}

/* SUBLINE */
.subline {
  margin-top: 10px;
  font-size: 16px;
  color: #e6d3a3;
}

/* DESCRIPTION */
.desc {
  margin-top: 25px;
  font-size: 18px;
  line-height: 1.6;
}

/* BUTTON */
.btn {
  display: inline-block;
  margin-top: 40px;
  padding: 16px 28px;
  background: #d4af37;
  color: #111;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
  font-size: 18px;
  box-shadow: 0 0 20px rgba(212,175,55,0.4);
}

.btn:hover {
  background: #f5d97a;
}

/* FOOTER */
.footer {
  margin-top: 80px;
  font-size: 12px;
  color: #cdbb8f;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">MyStoryChip</div>

  <div class="tagline">YOUR CHIP. YOUR STORY.</div>

  <h1>
    TAP ANYTHING.<br>
    INSTANTLY SEE ITS STORY.
  </h1>

  <div class="subline">
    Powered by MyStoryChip NFC technology
  </div>

  <div class="desc">
    Attach a MyStoryChip to anything.<br>
    Tap it with your phone and instantly open its story, photos, or history.
  </div>

  <a href="buy.html" class="btn">Get Your Chip</a>

  <div class="footer">
    MyStoryChip.com<br>
    Founder & Creator: Jack W. Kennedy
  </div>

</div>

</body>
</html>
