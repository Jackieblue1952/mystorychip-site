<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStoryChip</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0a0a0a;
  color: #f5e6c8;
}

/* HERO BACKGROUND IMAGE */
.hero {
  height: 100vh;
  background: url('landing-image.png') center/cover no-repeat;
  position: relative;
}

/* DARK OVERLAY FOR READABILITY */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 55%;
  height: 100%;
  background: linear-gradient(to right, rgba(0,0,0,0.95), rgba(0,0,0,0.4), transparent);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px;
}

/* BRAND */
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.brand img {
  width: 80px;
}

.brand span {
  font-size: 26px;
  color: #f5d97a;
}

/* HEADLINE */
h1 {
  font-size: 56px;
  margin: 10px 0;
}

.sub {
  font-size: 20px;
  margin-bottom: 25px;
}

.highlight {
  color: #f5d97a;
}

/* ICON ROW */
.icons {
  display: flex;
  gap: 40px;
  margin: 25px 0;
}

.icon {
  text-align: center;
  font-size: 14px;
}

/* BUTTON */
.cta {
  background: #d4af37;
  color: black;
  padding: 16px 28px;
  border-radius: 30px;
  font-size: 18px;
  width: fit-content;
  cursor: pointer;
  transition: 0.3s;
}

.cta:hover {
  box-shadow: 0 0 20px rgba(212,175,55,0.6);
}

/* PERKS BAR */
.perks {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: space-around;
  padding: 20px 10px;
  font-size: 14px;
}

.perk {
  text-align: center;
}
</style>
</head>

<body>

<div class="hero">

  <div class="overlay">

    <div class="brand">
      <img src="msc-logo.png">
      <span>MyStoryChip.com</span>
    </div>

    <h1>YOUR CHIP.<br>YOUR STORY.</h1>

    <div class="sub">
      Tap your phone. <span class="highlight">Open the vault.</span>
    </div>

    <div class="icons">
      <div class="icon">🔒<br>One Tap Access</div>
      <div class="icon">⚡<br>Instant Access</div>
      <div class="icon">❤️<br>Stories That Last</div>
    </div>

    <div class="cta">START YOUR STORY →</div>

  </div>

  <div class="perks">
    <div class="perk">☁️<br>250MB Free Storage</div>
    <div class="perk">🔐<br>Ownership Privacy</div>
    <div class="perk">👤<br>Owner Controlled</div>
    <div class="perk">✏️<br>Easy To Update</div>
    <div class="perk">👨‍👩‍👧<br>Share With Loved Ones</div>
    <div class="perk">♾️<br>Built To Last</div>
  </div>

</div>

</body>
</html>
