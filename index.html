<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStoryChip — Tap Into the Story Behind Anything</title>

  <style>
     {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050505;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .page {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 22% 46%, rgba(212,175,55,0.16) 0%, rgba(212,175,55,0.07) 18%, rgba(0,0,0,0) 42%),
        linear-gradient(to right, rgba(0,0,0,0.48) 0%, rgba(0,0,0,0.20) 30%, rgba(0,0,0,0.04) 52%, rgba(0,0,0,0.22) 100%);
    }

    .poster-wrap,
    .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .poster img {
      width: 100%;
      height: 100%;
      
      object-fit: cover;
      object-position: center bottom;

      pointer-events: none;
      user-select: none;
      
      filter:
        drop-shadow(0 0 18px rgba(212,175,55,0.18))
        drop-shadow(0 0 42px rgba(212,175,55,0.10));
    }

    .left-overlay {
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  width: auto;
  z-index: 9000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  pointer-events: none;
}

    .left-overlay::before {
  display: none;
}

    .hero-title {
      font-size: clamp(1.8rem, 3.8vw, 3rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #f4d38a;
      text-shadow:
        0 0 10px rgba(212,175,55,0.20),
        0 0 25px rgba(0,0,0,0.65);
    }

    .hero-text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1rem, 1.55vw, 1.45rem);
      line-height: 1.45;
      color: rgba(249,239,214,0.96);
      max-width: 30ch;
      text-shadow: 0 0 16px rgba(0,0,0,0.72);
    }

    .hero-text strong {
      color: #ffd577;
      font-weight: 700;
    }

    .hero-actions {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  pointer-events: auto;
  margin-top: 0;
}

    .story-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 230px;
      padding: 15px 30px;
      border-radius: 999px;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.95rem, 1.15vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #3a2a10;
      background: linear-gradient(
  180deg,
  #efe2b8 0%,
  #d8c48a 50%,
  #bfa35e 100%
);
      border: 1px solid rgba(255,220,140,0.80);
     box-shadow:
  0 0 10px rgba(212,175,55,0.18),
0 0 20px rgba(212,175,55,0.10),
  inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
    }

    .story-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 0 24px rgba(255,220,140,0.42),
        0 0 44px rgba(212,175,55,0.24),
        inset 0 1px 0 rgba(255,245,210,0.86);
      filter: brightness(1.03);
    }

    .story-btn:active {
      transform: translateY(0) scale(0.995);
    }

    .site-line {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.88rem, 1vw, 1rem);
      letter-spacing: 0.08em;
      color: rgba(245,230,200,0.84);
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(0,0,0,0.72);
      pointer-events: none;
    }

    .admin-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10000;
      padding: 7px 15px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f5e6c8;
      text-decoration: none;
      background: rgba(212,175,55,0.10);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 999px;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(212,175,55,0.15);
      transition: all 0.25s ease;
    }

    .admin-btn:hover {
      background: rgba(212,175,55,0.18);
      box-shadow:
        0 0 14px rgba(245,217,122,0.25),
        0 0 28px rgba(212,175,55,0.18);
    }

    .disclaimer-text {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: min(92vw, 900px);
      text-align: center;
      z-index: 9500;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      line-height: 1.35;
      color: rgba(232,220,192,0.64);
      text-shadow: 0 0 12px rgba(0,0,0,0.60);
    }

    

    .chip-hint {
       display: none;
      
      position: absolute;
      left: 50%;
      top: 51.3%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(245,230,200,0.78);
      text-shadow: 0 0 14px rgba(0,0,0,0.68);
      pointer-events: none;
      opacity: 0;
      animation: hintFade 2.4s ease-in-out infinite;
     
    }

    @keyframes chipPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.92);
        box-shadow:
          0 0 12px rgba(255,215,120,0.34),
          0 0 24px rgba(212,175,55,0.22);
      }
      45% {
        transform: translate(-50%, -50%) scale(1.18);
        box-shadow:
          0 0 36px rgba(255,230,150,0.72),
          0 0 78px rgba(212,175,55,0.50);
      }
      100% {
        transform: translate(-50%, -50%) scale(0.92);
        box-shadow:
          0 0 12px rgba(255,215,120,0.34),
          0 0 24px rgba(212,175,55,0.22);
      }
    }

    @keyframes hintFade {
      0%, 100% {
        opacity: 0;
      }
      35%, 65% {
        opacity: 1;
      }
    }

    @media (max-width: 1100px) {
      .left-overlay {
        left: 4.5%;
        width: min(40vw, 460px);
      }

      .story-btn {
        min-width: 210px;
      }
    }

    @media (max-width: 820px) {
      .poster img {
        object-fit: cover;
      }

      .left-overlay {
        left: 50%;
        top: auto;
        bottom: 8%;
        transform: translateX(-50%);
        width: min(88vw, 560px);
        text-align: center;
        align-items: center;
        gap: 14px;
      }

      .left-overlay::before {
  content: "";
  position: absolute;
  inset: -20px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.75) 0%,
    rgba(0,0,0,0.55) 40%,
    rgba(0,0,0,0.25) 70%,
    rgba(0,0,0,0) 100%
  );

  border-radius: 12px;
  z-index: -1;
}

      .hero-text {
        max-width: 34ch;
      }

      .hero-actions {
        justify-content: center;
      }

      .site-line {
        font-size: 0.82rem;
      }

      .story-hotspot {
        top: 53%;
      }

      .chip-hint {
        top: 48.5%;
        font-size: 0.66rem;
      }

      .admin-btn {
        top: 12px;
        right: 12px;
      }

      .disclaimer-text {
        bottom: 6px;
        font-size: 0.6rem;
      }
    }

    @media (max-width: 560px) {
      .left-overlay {
        bottom: 7%;
        gap: 12px;
      }

      .hero-title {
        font-size: clamp(1.75rem, 9vw, 2.5rem);
      }

      .hero-text {
        font-size: 0.98rem;
        line-height: 1.38;
      }

      .story-btn {
        min-width: 190px;
        padding: 13px 22px;
        font-size: 0.92rem;
      }

      .story-hotspot {
        width: 15vw;
        height: 15vw;
        min-width: 52px;
        min-height: 52px;
        max-width: 78px;
        max-height: 78px;
      }

      .chip-hint {
        top: 47.5%;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="poster-wrap">
      <div class="poster">
        <img src="landing-page.png" alt="MyStoryChip landing page" />

        <a href="admin.html" class="admin-btn">Admin</a>

        <div class="left-overlay">
          

        <div class="left-overlay">
  <div class="hero-actions">
    <a href="story.html" class="story-btn">Start Your Story</a>
  </div>
</div>

        <div class="disclaimer-text">
          By using this site, you agree to our Terms & Disclaimer
        </div>

        <a href="story.html" class="story-hotspot" aria-label="Open The MyStoryChip Story"></a>
      </div>
    </div>
  </div>
</body>
</html>
