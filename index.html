<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStoryChip — Tap Into the Story Behind Anything</title>
<meta name="description" content="MyStoryChip connects real-world objects to a living digital story. Tap once to share memories, information, and meaning — instantly." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
  width: 100%;
  height: 100%;
  background: #0a0a0a;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5d8a2;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at center, rgba(212, 175, 55, 0.12), transparent 55%)
        linear-gradient(to bottom, #0a0a0a 0%, #050505 100%);
      overflow: hidden;
    }

    .poster-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .poster {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .poster::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 1;
  pointer-events: none;
}

    .poster img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  display: block;
position: relative;
z-index: 2;
  filter:
    drop-shadow(0 0 20px rgba(212, 175, 55, 0.18))
    drop-shadow(0 0 50px rgba(212, 175, 55, 0.10));

  user-select: none;
  -webkit-user-drag: none;
}

 .hotspot {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: block;
  text-indent: -9999px;
  overflow: hidden;
  white-space: nowrap;
  border-radius: 999px;
  transition: none;
  cursor: pointer;
  z-index: 5;
}

   .hotspot:hover {
  transform: translateX(-50%);
} 

    .story-hotspot {
  top: 73.2%;
  width: min(28vw, 380px);
  height: min(5.8vw, 80px);
  background: transparent;
  box-shadow: none;
}

.story-hotspot,
.enter-hotspot {
  background: transparent !important;
  box-shadow: none !important;
  border: none !important;
}

.enter-hotspot {
  top: 91.7%;
  width: 28vw;
  height: 6vw;
  background: rgba(255, 190, 80, 0.10);
  box-shadow: 0 0 12px rgba(255, 170, 60, 0.22);
  animation: breatheGlow 2.2s ease-in-out infinite;
}
.hotspot {
  cursor: pointer;
}
.story-hotspot:hover {
  background: rgba(255, 210, 120, 0.03);
  box-shadow: none;
}

   .enter-hotspot {
  top: 92%;

  width: min(14vw, 190px);
  height: min(3.4vw, 48px);

  display: flex;
  align-items: center;
  justify-content: center;

  text-indent: 0;
  overflow: visible;
  white-space: nowrap;

  color: #f5e6c8;
  font-size: 1rem;
  letter-spacing: 0.08em;
  text-decoration: none;

  background: rgba(212, 175, 55, 0.06);
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 999px;

  box-shadow: 0 0 14px rgba(212, 175, 55, 0.18);

  z-index: 10;
  cursor: pointer;

  transition: all 0.3s ease;
} 

    .enter-hotspot:hover {
  color: #000;
  background: #d4af37;
  border-color: #d4af37;
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
}

    @media (max-aspect-ratio: 4/3) {
      .story-hotspot {
        top: 72.8%;
        width: 40vw;
        height: 6.8vw;
      }

    
    }

    @media (max-width: 640px) {
      html, body {
        overflow: auto;
      }

      .page {
        min-height: 100vh;
        height: auto;
      }

      .poster-wrap {
        position: relative;
        min-height: 100vh;
        padding: 10px;
      }

      .poster {
        min-height: 100vh;
      }

      .poster img {
        width: 100%;
        height: auto;
        max-height: none;
        position: relative;
        z-index: 1;
      }

.story-hotspot {
  top: 73%;
  width: 52vw;
  height: 9vw;

  cursor: pointer;
  animation: storyGlow 2.5s ease-in-out infinite;
}
 @keyframes storyGlow {
  0% {
    box-shadow: 0 0 6px rgba(212,175,55,0.08);
  }
  50% {
    box-shadow: 0 0 16px rgba(212,175,55,0.20);
  }
  100% {
    box-shadow: 0 0 6px rgba(212,175,55,0.08);
  }
}
</style> 
</head>
<body>
  <main class="page">
    <div class="poster-wrap">
      <div class="poster">
     <img src="landing-page.png" alt="MyStoryChip landing artwork" />  

     <a class="hotspot story-hotspot" href="story.html">The MyStoryChip Story</a>

<a class="entry-link" href="story.html">Enter Here</a>
      </div>
    </div>
