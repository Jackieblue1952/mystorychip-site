<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The story behind MyStoryChip — how one idea became a simple way to connect physical items to permanent digital memories." />
  <title>The Story Behind MyStoryChip</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      background: linear-gradient(to bottom, #120904 0%, #050505 100%);
      min-height: 100vh;
    }

    .nav-buttons {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      text-decoration: none;
      color: #f5e6c8;
      border: 1px solid #d4af37;
      border-radius: 30px;
      background: rgba(20, 12, 4, 0.88);
      font-size: 14px;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(212,175,55,0.15);
    }

    .btn:hover {
      background: rgba(60, 35, 10, 0.95);
      box-shadow: 0 0 16px rgba(212,175,55,0.35);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(180deg, #d4af37, #8e6a17);
      color: #1a1206;
      font-weight: bold;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }

    .hero img {
      width: 100%;
      max-width: 1200px;
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow:
        0 0 40px rgba(255,180,50,0.12),
        0 0 90px rgba(0,0,0,0.55);
    }

    .img-fallback {
      display: none;
      text-align: center;
      color: #f5e6c8;
      padding: 60px 24px;
      max-width: 600px;
      margin: 0 auto;
    }

    .img-fallback h2 {
      color: #d4af37;
      font-size: 2rem;
      margin-bottom: 16px;
    }

    .img-fallback p {
      color: #c8a96e;
      line-height: 1.7;
      font-size: 1.1rem;
    }

    .footer {
      text-align: center;
      padding: 24px 16px;
      color: rgba(212,175,55,0.45);
      font-size: 0.8rem;
    }

    @media (max-width: 900px) {
      .nav-buttons {
        top: 10px;
        right: 10px;
        gap: 8px;
      }

      .btn {
        padding: 8px 12px;
        font-size: 12px;
      }

      .hero {
        padding: 60px 10px 10px;
      }
    }
  </style>
</head>
<body>

  <div class="nav-buttons">
    <a href="index.html" class="btn">← Home</a>
    <a href="uses.html" class="btn">Next →</a>
  </div>

  <section class="hero">
    <img
      src="final-storybook.png"
      alt="The Story Behind MyStoryChip"
      id="storyImg"
      onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';"
    >
    <div class="img-fallback" id="fallback">
      <h2>The Story Behind MyStoryChip</h2>
      <p>
        MyStoryChip was created to give people a simple, lasting way to connect
        the physical world to their most meaningful memories, records, and stories —
        with nothing more than a tap.
      </p>
      <a href="index.html" class="btn primary" style="margin-top:24px; display:inline-block;">
        Learn More
      </a>
    </div>
  </section>

  <footer class="footer">
    © 2026 MyStoryChip.com · Founder &amp; Creator: Jack W. Kennedy
  </footer>

</body>
</html>
