<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Story Behind MyStoryChip</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #050505;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      background: linear-gradient(to bottom, #120904 0%, #050505 100%);
    }

    .nav-buttons {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      text-decoration: none;
      color: #f5e6c8;
      border: 1px solid #d4af37;
      border-radius: 30px;
      background: rgba(20, 12, 4, 0.88);
      font-size: 14px;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(212,175,55,0.15);
    }

    .btn:hover {
      background: rgba(60, 35, 10, 0.95);
      box-shadow: 0 0 16px rgba(212,175,55,0.35);
    }

    .btn.primary {
      background: linear-gradient(180deg, #d4af37, #8e6a17);
      color: #1a1206;
      font-weight: bold;
    }

    .hero {
      min-height: 100vh;
      padding: 30px 20px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .hero img {
      width: 100%;
      max-width: 1500px;
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow:
        0 0 40px rgba(255,180,50,0.12),
        0 0 90px rgba(0,0,0,0.55);
    }

    @media (max-width: 900px) {
      .nav-buttons {
        top: 10px;
        right: 10px;
        gap: 8px;
      }

      .btn {
        padding: 8px 12px;
        font-size: 12px;
      }

      .hero {
        padding: 60px 10px 10px;
      }
    }
  </style>
</head>
<body>

  <div class="nav-buttons">
    <a href="index.html" class="btn">← Home</a>
    <a href="use.html" class="btn">Uses →</a>
    
  <section class="hero">
  <img src="final-storybook.png" alt="The Story Behind MyStoryChip">
</section>

</body>
</html>
