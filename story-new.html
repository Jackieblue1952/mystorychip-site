<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The MyStoryChip Story</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  background: #050505;
  color: #f5e7c2;
  font-family: "Georgia", "Times New Roman", serif;
  overflow-x: hidden;
}

/* HERO SECTION */
.hero {
  min-height: 100vh;

  background:
    radial-gradient(circle at center, rgba(212,168,74,0.18), transparent 60%),
    url("chip.png") center center / cover no-repeat;

  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  padding: 40px 20px;
}

/* HERO CONTENT */
.hero-content {
  max-width: 900px;
}

/* TITLE */
.hero h1 {
  font-size: clamp(42px, 6vw, 72px);
  font-weight: bold;
  letter-spacing: 2px;

  color: #f2d280;

  text-shadow:
    0 0 12px rgba(212,168,74,0.6),
    0 0 30px rgba(212,168,74,0.25);

  margin-bottom: 20px;
}

/* SUBTEXT */
.hero p {
  font-size: 20px;
  line-height: 1.6;
  color: #e6c77a;

  max-width: 700px;
  margin: 0 auto;
}

</style>
</head>

<body>

<section class="hero">

  <div class="hero-content">

    <h1>The MyStoryChip Story</h1>

    <p>
      How one quiet moment became a new way to preserve memories, meaning,
      and the stories life leaves behind.
    </p>

  </div>

</section>

</body>
</html>
