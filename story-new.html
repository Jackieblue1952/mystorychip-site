<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Story Behind MyStoryChip</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      margin: 0;
      background: #050505;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* TOP BUTTONS */
    .nav-buttons {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 16px;
      text-decoration: none;
      color: #f5e6c8;
      border: 1px solid #d4af37;
      border-radius: 30px;
      background: rgba(20, 12, 4, 0.85);
      font-size: 14px;
      transition: 0.3s;
    }

    .btn:hover {
      background: rgba(60, 35, 10, 0.95);
      box-shadow: 0 0 10px #d4af37;
    }

    .btn.primary {
      background: linear-gradient(180deg, #d4af37, #8e6a17);
      color: #1a1206;
      font-weight: bold;
    }

    /* HERO IMAGE */
    .hero {
  position: relative;
  min-height: 100vh;
  padding: 40px 20px;
}

    .hero img {
      width: 100%;
      max-width: 1400px;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(255,180,50,0.15);
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .nav-buttons {
        top: 10px;
        right: 10px;
      }

      .btn {
        font-size: 12px;
        padding: 8px 12px;
      }
      .hero {
  position: relative;
}

.hero-overlay {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #f5e6c8;
  text-shadow: 0 0 20px rgba(0,0,0,0.9);
}

.hero-overlay h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

.hero-sub {
  font-size: 20px;
  color: #d4af37;
}
    }
  </style>
</head>

<body>

  <!-- NAV BUTTONS -->
  <div class="nav-buttons">
    <a href="index.html" class="btn">← Home</a>
    <a href="use.html" class="btn">Uses →</a>
    <a href="buy.html" class="btn primary">Buy Now</a>
  </div>

  <!-- STORY BOOK IMAGE -->
  <section class="hero">
  <img src="storybook-image.png" alt="The Story Behind MyStoryChip">

  <div class="hero-overlay">
    <h1>The Story Behind MyStoryChip</h1>
    <p class="hero-sub">
      Where memories live… beyond time.
    </p>
  </div>
</section>

</body>
</html>
