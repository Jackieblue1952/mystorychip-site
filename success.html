<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Complete | MyStoryChip</title>

<style>
  .welcome {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
}

.story-line {
  font-size: 20px;
  margin: 8px 0 16px;
}

.next-step {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
}
body {
  margin: 0;
  font-family: Georgia, serif;
background:
  radial-gradient(circle at top, rgba(245,217,122,0.16), transparent 28%),
  linear-gradient(180deg, rgba(5,5,5,0.72), rgba(0,0,0,0.94)),
  url("landing-page.png") center/cover no-repeat;  
 color: #2a1a08; 
  text-align: center;
}
  .code {
  color: #2a1a08 !important;
  font-weight: bold;
  font-size: 30px;
  letter-spacing: 1px;
}

.wrap {
  max-width: 600px;
  margin: 120px auto;
  padding: 40px 20px;
}

.card {
 background: linear-gradient(
  145deg,
  rgba(255, 245, 210, 0.92),
  rgba(255, 230, 160, 0.82)
); 
  border: 1px solid rgba(212,175,55,0.3);
  border-radius: 20px;
  padding: 30px;
box-shadow:
  0 15px 40px rgba(0,0,0,0.45),
  inset 0 0 25px rgba(255, 230, 160, 0.15);  
}

h1 {
  margin-bottom: 10px;
}

.btn {
  display: block;
  margin: 15px auto;
  padding: 14px 20px;
  border-radius: 25px;
  text-decoration: none;
  font-weight: bold;
  width: 80%;
  max-width: 260px;
}

.primary {
background: linear-gradient(145deg, #d4af37, #f1d27a);
color: #1b1206;
box-shadow: 0 6px 18px rgba(0,0,0,0.25);
border: none; 
}

.secondary {
  background: transparent;
  border: 2px solid #d4af37;
  color: #2a1a08;
}
.btn:hover {
  transform: translateY(-2px);
  transition: all 0.2s ease;
}

.primary:hover {
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  filter: brightness(1.05);
}

.secondary:hover {
  background: rgba(212,175,55,0.08);
  box-shadow: 0 0 12px rgba(212,175,55,0.25);
}  

.footer {
  margin-top: 30px;
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">
<div class="welcome">Welcome to MyStoryChip</div>

<h1>Your Chip Is Live</h1>

<div class="story-line">Your story starts here.</div>

<div class="next-step">Next Step: Build Your Page</div>

<div id="chipCode" class="code">TEST123</div>

<a id="setupBtn" class="btn primary" href="#">Edit My Page</a>
<a id="viewBtn" href="#">View My Page</a>  

  </div>

  <div class="footer">
    MyStoryChip.com<br>
    Founder & Creator: Jack W. Kennedy
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

const chipCode = document.getElementById("chipCode");
const setupBtn = document.getElementById("setupBtn");
const viewBtn = document.getElementById("viewBtn");

if (code && code !== "null") {
  chipCode.textContent = code;
  setupBtn.href = `client-setup.html?code=${code}`;
  viewBtn.href = `chip.html?code=${code}`;
} else {
  chipCode.textContent = "TEST123";
  setupBtn.href = "client-setup.html?code=TEST123";
  viewBtn.href = "chip.html?code=TEST123";
}
</script>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

const viewBtn = document.getElementById("viewBtn");

if (viewBtn && code) {
  viewBtn.href = "chip.html?code=" + code;
}
</script>
</body>
</html>
