<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Complete | MyStoryChip</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
background:
  radial-gradient(circle at top, rgba(245,217,122,0.16), transparent 28%),
  linear-gradient(180deg, rgba(5,5,5,0.72), rgba(0,0,0,0.94)),
  url("landing-page.png") center/cover no-repeat;  
  color: #f5e6c8;
  text-align: center;
}

.wrap {
  max-width: 600px;
  margin: 100px auto;
  padding: 40px 20px;
}

.card {
  background: rgba(5,5,5,0.82);
  border: 1px solid rgba(212,175,55,0.3);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h1 {
  margin-bottom: 10px;
}

.code {
  font-size: 28px;
  margin: 20px 0;
  color: #f5d97a;
}

.btn {
  display: block;
  margin: 15px auto;
  padding: 14px 20px;
  border-radius: 25px;
  text-decoration: none;
  font-weight: bold;
  width: 80%;
  max-width: 260px;
}

.primary {
  background: #d4af37;
  color: #111;
}

.secondary {
  border: 1px solid #d4af37;
  color: #f5e6c8;
}

.footer {
  margin-top: 30px;
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Your Chip Is Ready</h1>

 <div>Next Step:</div>
<div id="chipCode" class="code">Set Up Your Chip</div>   

    <a id="setupBtn" class="btn primary">Edit My Chip</a>
    <a id="viewBtn" class="btn secondary">View My Chip</a>

  </div>

  <div class="footer">
    MyStoryChip.com<br>
    Founder & Creator: Jack W. Kennedy
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

const chipCode = document.getElementById("chipCode");
const setupBtn = document.getElementById("setupBtn");
const viewBtn = document.getElementById("viewBtn");

if (code && code !== "null") {
  chipCode.textContent = code;
  setupBtn.href = `client-setup.html?code=${code}`;
  viewBtn.href = `chip.html?code=${code}`;
} else {
  chipCode.textContent = "TEST123";
  setupBtn.href = "client-setup.html?code=TEST123";
  viewBtn.href = "chip.html?code=TEST123";
}
</script>

</body>
</html>
