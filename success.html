<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Your MyStoryChip is live! Start building your digital story page." />
<title>Setup Complete | MyStoryChip</title>
<style>
  body {
    margin: 0;
    font-family: Georgia, serif;
    background:
      radial-gradient(circle at top, rgba(245,217,122,0.16), transparent 28%),
      linear-gradient(180deg, rgba(5,5,5,0.72), rgba(0,0,0,0.94)),
      url("landing-page.png") center/cover no-repeat;
    color: #2a1a08;
    text-align: center;
  }

  .home-btn {
    position: fixed;
    top: 16px;
    left: 18px;
    z-index: 50;
    display: inline-block;
    text-decoration: none;
    color: #7e570e;
    background: rgba(255,255,255,0.88);
    border: 1px solid rgba(180,130,35,0.32);
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: bold;
    font-size: 0.85rem;
    box-shadow: 0 6px 18px rgba(100,70,20,0.12);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .home-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(100,70,20,0.18);
  }

  .welcome {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
  }

  .story-line {
    font-size: 20px;
    margin: 8px 0 16px;
  }

  .next-step {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .code {
    color: #2a1a08 !important;
    font-weight: bold;
    font-size: 30px;
    letter-spacing: 1px;
  }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 80px 20px 40px;
  }

  .card {
    background: linear-gradient(
      145deg,
      rgba(255, 245, 210, 0.92),
      rgba(255, 230, 160, 0.82)
    );
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 20px;
    padding: 30px;
    box-shadow:
      0 15px 40px rgba(0,0,0,0.45),
      inset 0 0 25px rgba(255, 230, 160, 0.15);
  }

  h1 {
    margin-bottom: 10px;
  }

  .btn {
    display: block;
    margin: 15px auto;
    padding: 14px 20px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
    width: 80%;
    max-width: 260px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  .primary {
    background: linear-gradient(145deg, #d4af37, #f1d27a);
    color: #1b1206;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    border: none;
  }

  .primary:hover {
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    filter: brightness(1.05);
  }

  .secondary {
    background: transparent;
    border: 2px solid #d4af37;
    color: #2a1a08;
  }

  .secondary:hover {
    background: rgba(212,175,55,0.08);
    box-shadow: 0 0 12px rgba(212,175,55,0.25);
  }

  .footer {
    margin-top: 30px;
    font-size: 12px;
    opacity: 0.7;
    color: #f3e6c7;
  }

  @media (max-width: 600px) {
    .wrap {
      padding: 70px 16px 30px;
    }
  }
</style>
</head>
<body>

<a class="home-btn" href="index.html">🏠 Home</a>

<div class="wrap">
  <div class="card">
    <div class="welcome">Welcome to MyStoryChip</div>
    <h1>Your Chip Is Live</h1>
    <div class="story-line">Your story starts here.</div>
    <div class="next-step">Next Step: Build Your Page</div>
    <div id="chipCode" class="code">Loading chip code...</div>
    <a id="setupBtn" class="btn primary" href="#">Edit My Page</a>
    <a id="viewBtn" class="btn secondary" href="#">View My Page</a>
  </div>
  <div class="footer">
    MyStoryChip.com<br>
    Founder &amp; Creator: Jack W. Kennedy
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const chipCode = document.getElementById("chipCode");
const setupBtn = document.getElementById("setupBtn");
const viewBtn = document.getElementById("viewBtn");

if (code && code !== "null") {
  chipCode.textContent = code;
  setupBtn.href = `client-setup.html?code=${code}`;
  viewBtn.href = `chip.html?code=${code}`;
} else {
  chipCode.textContent = "Missing chip code. Please return to your purchase link or contact MyStoryChip support.";
  setupBtn.removeAttribute("href");
  viewBtn.removeAttribute("href");
  setupBtn.style.opacity = "0.5";
  viewBtn.style.opacity = "0.5";
}
</script>
</body>
</html>
