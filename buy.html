<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #000;
  color: #f5e6c8;
}

.hero {
  position: relative;
  height: 100vh;
  background: url("buy-hero.png") center/cover no-repeat;
}

/* dark overlay for readability */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.content {
  position: absolute;
  top: 50%;
  left: 8%;
  transform: translateY(-50%);
  z-index: 2;
  max-width: 520px;
}

h1 {
  font-size: 3.5rem;
  margin-bottom: 10px;
  color: #f5d97a;
  text-shadow: 0 0 20px rgba(245,217,122,.5);
}

.sub {
  font-size: 1.4rem;
  margin-bottom: 25px;
}

.price {
  font-size: 2.2rem;
  margin-bottom: 20px;
}

.buy-btn {
  display: inline-block;
  padding: 18px 34px;
  background: linear-gradient(135deg, #f5d97a, #d4af37);
  color: #000;
  text-decoration: none;
  font-weight: bold;
  border-radius: 50px;
  font-size: 1.2rem;
  box-shadow: 0 0 25px rgba(245,217,122,.7);
  transition: .2s;
}

.buy-btn:hover {
  transform: scale(1.05);
}

.details {
  margin-top: 15px;
  font-size: 0.95rem;
  color: #e8dcc0;
}

.topbar {
  position: absolute;
  top: 20px;
  left: 30px;
  right: 30px;
  display: flex;
  justify-content: space-between;
  z-index: 3;
}

.brand {
  color: #f5d97a;
  font-weight: bold;
}

.home {
  color: #f5e6c8;
  text-decoration: none;
  border: 1px solid #d4af37;
  padding: 8px 14px;
  border-radius: 20px;
}

</style>
</head>

<body>

<div class="hero">

  <div class="topbar">
    <div class="brand">MyStoryChip</div>
    <a class="home" href="index.html">Home</a>
  </div>

  <div class="content">
    <h1>Own the Chip.<br>Keep the Story.</h1>

    <div class="sub">
      Tap your phone. Instantly open stories, memories, documents, and more.
    </div>

    <div class="price">$49.95</div>

    <a class="buy-btn" href="PASTE_YOUR_STRIPE_LINK_HERE">
      BUY YOUR CHIP
    </a>

    <div class="details">
      One-time purchase • Includes 250MB storage • No monthly fees
    </div>
  </div>

</div>

</body>
</html>
