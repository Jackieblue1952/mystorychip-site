<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<style>
body {
  margin: 0;
  background: #000;
  font-family: Georgia, serif;
}

/* FULL IMAGE BACKGROUND */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: url("chip.png") center/cover no-repeat;
}

/* DARK OVERLAY (slight for readability) */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.25);
}

/* CLICKABLE BUY BUTTON OVER IMAGE BUTTON */
.buy-click {
  position: absolute;
  right: 6%;
  bottom: 12%;
  padding: 18px 36px;
  border-radius: 40px;

  background: linear-gradient(135deg, #f5d97a, #d4af37);
  color: #000;
  font-size: 1.2rem;
  font-weight: bold;
  text-decoration: none;

  box-shadow:
    0 0 18px rgba(245,217,122,0.6),
    0 0 35px rgba(212,175,55,0.4);

  z-index: 5;
  transition: all 0.2s ease;
}
  .buy-click:hover {
  transform: scale(1.05);

  box-shadow:
    0 0 28px rgba(245,217,122,0.95),
    0 0 55px rgba(212,175,55,0.7),
    0 0 85px rgba(212,175,55,0.4);
}

/* OPTIONAL glow hover so YOU can see it working */
.buy-click:hover {
  box-shadow: 0 0 25px rgba(245,217,122,.8);
  border-radius: 40px;
}

/* TOP NAV */
.topbar {
  position: absolute;
  top: 20px;
  left: 30px;
  right: 30px;
  display: flex;
  justify-content: space-between;
  z-index: 3;
}

.home {
  color: #f5e6c8;
  text-decoration: none;
  border: 1px solid #d4af37;
  padding: 8px 14px;
  border-radius: 20px;
}
</style>
</head>

<body>

<div class="hero">

  <div class="topbar">
    <div style="color:#f5d97a;font-weight:bold;">MyStoryChip</div>
    <a class="home" href="index.html">Home</a>
  </div>

  <!-- INVISIBLE BUY BUTTON -->
 <a class="buy-click" href="https://buy.stripe.com/00w5kCgXe1Fwcu05dkdby02">
  GET YOUR CHIP →
</a> 

</div>

</body>
</html>
