<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<style>
body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial, sans-serif;
}

/* HEADER */
.header{
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(212,175,55,.2);
}

.logo{
  color:#d4af37;
  font-weight:bold;
  font-size:18px;
}

/* MAIN */
.container{
  max-width:1000px;
  margin:60px auto;
  padding:20px;
}

/* TITLE */
h1{
  font-size:42px;
  color:#f5d984;
  margin-bottom:10px;
}

.sub{
  color:#ccc;
  margin-bottom:40px;
}

/* CARD */
.card{
  background:rgba(20,20,20,.8);
  border:1px solid rgba(212,175,55,.25);
  border-radius:16px;
  padding:30px;
  margin-bottom:30px;
}

/* PRICE */
.price{
  font-size:36px;
  color:#f5d984;
  margin:20px 0;
}

/* BUY BUTTON */
.buy-btn{
  display:block;
  width:100%;
  padding:16px;
  text-align:center;
  border-radius:999px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
  text-decoration:none;
  box-shadow:0 0 20px rgba(212,175,55,.4);
  transition:.2s;
}

.buy-btn:hover{
  transform:scale(1.03);
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">MyStoryChip</div>
</div>

<div class="container">

  <h1>One Chip. Unlimited Uses.</h1>
  <div class="sub">
    You’re not buying a chip. You’re unlocking a story people can access instantly.
  </div>

  <div class="card">
    <h2>The Chip</h2>
    <div class="price">$49.95</div>

    <p>Includes 250MB storage</p>
    <p>Personal story link attached</p>
    <p>Works instantly with a phone tap</p>

    <a href="#" class="buy-btn">BUY NOW</a>
  </div>

</div>

</body>
</html>
