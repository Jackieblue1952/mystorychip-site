<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<style>
body{
  margin:0;
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:#fff;
  font-family:Arial, sans-serif;
}

/* HEADER */
.header{
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(212,175,55,.15);
}

.logo{
  color:#d4af37;
  font-weight:bold;
  font-size:18px;
}

/* MAIN */
.container{
  max-width:900px;
  margin:80px auto;
  padding:20px;
  text-align:center;
}

/* TITLE */
h1{
  font-size:46px;
  color:#f5d984;
  margin-bottom:10px;
  text-shadow:0 0 20px rgba(212,175,55,.25);
}

.sub{
  color:#ccc;
  margin-bottom:50px;
}

/* CARD */
.card{
  background:rgba(20,20,20,.85);
  border:1px solid rgba(212,175,55,.25);
  border-radius:18px;
  padding:40px;
  position:relative;
  overflow:hidden;
}

/* subtle glow */
.card::before{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  background:radial-gradient(circle,#d4af37,transparent 70%);
  top:-100px;
  right:-100px;
  opacity:.08;
}

/* PRICE */
.price{
  font-size:42px;
  color:#f5d984;
  margin:20px 0;
}

/* FEATURES */
.features{
  text-align:left;
  margin:30px 0;
  line-height:1.8;
  color:#ddd;
}

/* BUY BUTTON */
.buy-btn{
  display:inline-block;
  margin-top:25px;
  padding:16px 40px;
  border-radius:40px;
  background:linear-gradient(135deg,#d4af37,#f5d984);
  color:#000;
  font-weight:700;
  text-decoration:none;
  box-shadow:0 0 25px rgba(212,175,55,.5);
  transition:all .25s ease;
}

.buy-btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 40px rgba(212,175,55,.8);
}
/* TRUST LINE */
.trust{
  margin-top:15px;
  font-size:13px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">MyStoryChip</div>
</div>

<div class="container">

  <h1>Own Your Story</h1>
<p>Your memories. Your legacy. One simple tap brings it all to life.</p>

  <div class="card">

    <div class="price">$49.95</div>

    <ul>
  <li>✔ Includes 250MB secure storage</li>
  <li>✔ Works instantly with your phone</li>
  <li>✔ No apps. No subscriptions.</li>
</ul>

   <a href="#" class="buy-btn">Get Your Chip Now</a>

    <div class="trust">
      Secure checkout coming next
    </div>

  </div>

</div>

</body>
</html>
