<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050505;
  --bg2:#0b0907;
  --gold:#d4af37;
  --gold-soft:#f3d883;
  --gold-deep:#b8841f;
  --text:#f6f0e4;
  --muted:#d7ccb7;
  --line:rgba(212,175,55,.18);
  --panel:rgba(18,14,10,.88);
  --shadow:0 18px 50px rgba(0,0,0,.48);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  color:var(--text);
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at top, rgba(212,175,55,.08), transparent 24%),
    linear-gradient(to bottom, #080808 0%, #060505 35%, #040404 100%);
}

/* top strip */
.header{
  max-width:1200px;
  margin:0 auto;
  padding:22px 24px 16px;
  border-bottom:1px solid var(--line);
}

.logo{
  color:var(--gold);
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:.03em;
}

/* hero intro */
.container{
  max-width:980px;
  margin:0 auto;
  padding:54px 20px 90px;
  text-align:center;
}

h1{
  margin:0 0 12px;
  font-family:'Cinzel',serif;
  font-size:clamp(42px, 6vw, 64px);
  line-height:1;
  color:#f8e3a0;
  text-shadow:0 0 24px rgba(212,175,55,.18);
}

.sub{
  max-width:760px;
  margin:0 auto 42px;
  color:var(--muted);
  font-size:18px;
  line-height:1.7;
}

/* buy card */
.card{
  position:relative;
  max-width:760px;
  margin:0 auto;
  padding:40px 34px 34px;
  border-radius:24px;
  border:1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(25,18,12,.96), rgba(12,10,8,.98));
  box-shadow:var(--shadow);
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  right:-70px;
  top:-70px;
  width:220px;
  height:220px;
  background:radial-gradient(circle, rgba(212,175,55,.16), transparent 70%);
  pointer-events:none;
}

.card::after{
  content:"";
  position:absolute;
  left:-60px;
  bottom:-60px;
  width:180px;
  height:180px;
  background:radial-gradient(circle, rgba(212,175,55,.08), transparent 70%);
  pointer-events:none;
}

.kicker{
  font-family:'Cinzel',serif;
  color:#f2d27c;
  font-size:28px;
  margin-bottom:8px;
}

.price{
  font-family:'Cinzel',serif;
  font-size:58px;
  line-height:1;
  color:#f5d984;
  margin:8px 0 8px;
}

.price-note{
  color:#bfae85;
  font-size:14px;
  margin-bottom:24px;
}

.features{
  display:grid;
  gap:12px;
  margin:0 auto 28px;
  max-width:560px;
  text-align:left;
}

.feature{
  padding:14px 16px;
  border-radius:14px;
  border:1px solid rgba(212,175,55,.12);
  background:rgba(212,175,55,.05);
  color:#efe7d7;
  font-size:16px;
}

.buy-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:320px;
  padding:18px 42px;
  border-radius:999px;
  background:linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 55%, #c28a1e 100%);
  color:#120f08;
  font-weight:800;
  font-size:18px;
  letter-spacing:.03em;
  text-decoration:none;
  box-shadow:
    0 0 18px rgba(212,175,55,.36),
    0 0 42px rgba(212,175,55,.18);
  transition:.2s ease;
}

.buy-btn:hover{
  transform:translateY(-1px) scale(1.02);
  box-shadow:
    0 0 24px rgba(212,175,55,.5),
    0 0 56px rgba(212,175,55,.24);
}

.trust{
  margin-top:18px;
  color:#a99976;
  font-size:13px;
  line-height:1.6;
}

@media (max-width:700px){
  .container{
    padding:38px 14px 70px;
  }

  .card{
    padding:30px 18px 26px;
  }

  .buy-btn{
    min-width:100%;
  }

  .price{
    font-size:48px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">MyStoryChip</div>
</div>

<div class="container">

  <h1>Own Your Story</h1>

  <p class="sub">
    Your memories. Your legacy. One simple tap brings it all to life.
  </p>

  <div class="card">
    <div class="kicker">The Chip</div>

    <div class="price">$49.95</div>
    <div class="price-note">One-time purchase</div>

    <div class="features">
      <div class="feature">✔ Includes 250MB secure storage</div>
      <div class="feature">✔ Works instantly with your phone</div>
      <div class="feature">✔ No apps. No subscriptions.</div>
    </div>

    <a href="#" class="buy-btn">Get Your Chip Now</a>

    <div class="trust">
      Secure checkout coming next
    </div>
  </div>

</div>

</body>
</html>
