<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:Arial, sans-serif;
  color:#fff;
  text-align:center;
}

.hero{
  position:relative;
}

.hero img{
  width:100%;
  display:block;
  opacity:.85;
}

/* CONTENT SECTION */
.content{
  padding:60px 20px;
}

h1{
  font-size:42px;
  color:#f5d984;
  margin-bottom:10px;
}

.sub{
  font-size:18px;
  color:#ccc;
  margin-bottom:40px;
}

/* FEATURES */
.features{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:50px;
  color:#aaa;
}

/* PRICE */
.price{
  font-size:48px;
  color:#f5d984;
  margin-bottom:30px;
}

/* BUY BUTTON */
.buy-btn{
  display:inline-block;
  padding:18px 50px;
  border-radius:999px;
  background:linear-gradient(135deg,#f5d984,#caa64b);
  color:#000;
  font-weight:bold;
  text-decoration:none;
  font-size:20px;

  box-shadow:
    0 0 20px rgba(212,175,55,.6),
    0 0 40px rgba(212,175,55,.3);
}

.buy-btn:hover{
  transform:scale(1.05);
}

/* NOTE */
.note{
  margin-top:20px;
  font-size:14px;
  color:#777;
}
</style>
</head>

<body>

<div class="content">

  <h1>One Chip. Unlimited Uses.</h1>

  <div class="sub">
    Your stories, your images, your legacy — all with one tap.
  </div>

  <div class="features">
    <div>✔ Includes 250MB storage</div>
    <div>✔ No app required</div>
    <div>✔ Works instantly with your phone</div>
  </div>

  <div class="price">$49.95</div>

  <a href="#" class="buy-btn">BUY YOUR CHIP</a>

  <div class="note">
    One-time purchase. No subscriptions.
  </div>

</div>

</body>
</html>
