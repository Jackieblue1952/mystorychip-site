<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy MyStoryChip</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      color: #f5e6c8;
      background:
        radial-gradient(circle at top, rgba(212,175,55,0.10), transparent 30%),
        linear-gradient(180deg, #0b0e15 0%, #05070b 100%);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 22px 18px 28px;
      text-align: center;
    }

    .solo-buy-image {
      position: relative;
      margin: 0 auto;
      max-width: 1400px;
    }

    .solo-buy-image img {
      width: 100%;
      max-width: 1400px;
      display: block;
      margin: 0 auto;
      border-radius: 20px;
      box-shadow:
        0 0 28px rgba(212,175,55,0.14),
        0 18px 60px rgba(0,0,0,0.45);
      animation: heroFadeIn 0.9s ease-out;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .solo-buy-image img:hover {
      transform: scale(1.01);
      box-shadow:
        0 0 34px rgba(212,175,55,0.20),
        0 22px 70px rgba(0,0,0,0.52);
    }

    /* Invisible clickable hotspot over the button area inside the image */
    .buy-hotspot {
      position: absolute;
      left: 10.7%;
      bottom: 21.5%;
      width: 25.5%;
      height: 6.3%;
      border-radius: 999px;
      text-indent: -9999px;
      overflow: hidden;
      background: transparent;
      display: block;
    }

    /* Optional subtle hover for testing placement */
    .buy-hotspot:hover {
      box-shadow: 0 0 0 2px rgba(212,175,55,0.18);
    }

    @keyframes heroFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .wrap {
        padding: 14px 10px 18px;
      }

      .solo-buy-image img {
        border-radius: 14px;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 8px 6px 14px;
      }

      .solo-buy-image img {
        border-radius: 12px;
      }

      .buy-hotspot {
        left: 6.5%;
        bottom: 21.2%;
        width: 26%;
        height: 6.8%;
      }
      .home-hotspot {
  position: absolute;
  left: 10.2%;
  bottom: 14.6%;
  width: 15.5%;
  height: 3.3%;
  border-radius: 10px;
  text-indent: -9999px;
  overflow: hidden;
  background: transparent;
  display: block;
}

.terms-hotspot {
  position: absolute;
  left: 0.8%;
  bottom: 2.8%;
  width: 33%;
  height: 10.5%;
  border-radius: 12px;
  text-indent: -9999px;
  overflow: hidden;
  background: transparent;
  display: block;
}

/* optional test glow */
.home-hotspot:hover,
.terms-hotspot:hover {
  box-shadow: 0 0 0 2px rgba(212,175,55,0.18);
}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="solo-buy-image">
    <img src="buy-final.png" alt="Buy MyStoryChip">

    <a
      class="buy-hotspot"
      href="https://buy.stripe.com/00w5kCgXe1Fwcu05dkdby02"
      aria-label="Buy My Chip"
    >Buy My Chip</a>

    <a
      class="home-hotspot"
      href="index.html"
      aria-label="Back to Home"
    >Back to Home</a>

    <a
      class="terms-hotspot"
      href="terms.html"
      aria-label="Terms of Use"
    >Terms of Use</a>
  </div>
</div>  
</body>
</html>
