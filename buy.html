<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy MyStoryChip</title>
  <style>
    :root{
      --gold:#d4af37;
      --gold-light:#f5d97a;
      --gold-pale:#f5e6c8;
      --text:#f5e6c8;
      --dark:#050505;
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      padding:0;
      background:#050505;
      overflow-x:hidden;
      font-family:Georgia, "Times New Roman", serif;
    }

    body{
      background:
        radial-gradient(circle at center top, rgba(212,175,55,0.12), transparent 25%),
        linear-gradient(to bottom, #140904 0%, #050505 100%);
      color:var(--text);
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .nav-buttons{
      position:fixed;
      top:16px;
      right:16px;
      z-index:9999;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-block;
      padding:10px 16px;
      text-decoration:none;
      color:#f5e6c8;
      border:1px solid #d4af37;
      border-radius:30px;
      background:rgba(20,12,4,0.88);
      font-size:14px;
      transition:all 0.25s ease;
      box-shadow:0 0 10px rgba(212,175,55,0.15);
    }

    .btn:hover{
      background:rgba(60,35,10,0.95);
      box-shadow:0 0 16px rgba(212,175,55,0.35);
    }

    .btn.primary{
      background:linear-gradient(180deg, #d4af37, #8e6a17);
      color:#1a1206;
      font-weight:bold;
    }

    .hero{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:0;
      position:relative;
    }

    .hero-wrap{
      position:relative;
      width:100%;
      max-width:1200px;
      margin:0 auto;
    }

    .hero-image{
      width:100%;
      display:block;
      margin:0 auto;
    }

    .buy-overlay{
      position:absolute;
      left:50%;
      bottom:7%;
      transform:translateX(-50%);
      width:min(520px, 88%);
      padding:28px 24px 24px;
      border-radius:28px;
      background:linear-gradient(180deg, rgba(20,12,4,0.88), rgba(8,6,4,0.94));
      border:1px solid rgba(212,175,55,0.28);
      box-shadow:
        0 0 22px rgba(212,175,55,0.18),
        0 18px 40px rgba(0,0,0,0.45);
      text-align:center;
      backdrop-filter:blur(4px);
    }

    .kicker{
      margin:0 0 10px;
      color:var(--gold-light);
      font-size:13px;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }

    .headline{
      margin:0 0 10px;
      font-size:clamp(2rem, 4vw, 3.2rem);
      line-height:1.02;
      color:var(--gold-pale);
      text-shadow:0 0 14px rgba(212,175,55,0.12);
    }

    .subtext{
      margin:0 auto 16px;
      max-width:420px;
      font-size:1rem;
      line-height:1.6;
      color:#ead8b1;
    }

    .price{
      margin:10px 0 8px;
      font-size:3.5rem;
      line-height:1;
      color:#fff0c3;
      text-shadow:0 0 18px rgba(212,175,55,0.16);
    }

    .price-note{
      margin:0 0 18px;
      font-size:1rem;
      color:#e4cea1;
      line-height:1.6;
    }

    .mini-points{
      display:grid;
      gap:8px;
      margin:0 0 22px;
      color:#ddc79b;
      font-size:0.96rem;
      line-height:1.5;
    }

    .cta-row{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:180px;
      padding:14px 22px;
      border-radius:999px;
      font-size:1rem;
      font-weight:bold;
      transition:all 0.22s ease;
    }

    .cta.primary{
      background:linear-gradient(180deg, #f3d77b, #d4af37);
      color:#1a1206;
      box-shadow:0 0 18px rgba(212,175,55,0.22);
    }

    .cta.primary:hover{
      transform:translateY(-1px);
      box-shadow:0 0 24px rgba(212,175,55,0.34);
    }

    .cta.secondary{
      border:1px solid rgba(212,175,55,0.34);
      color:#f3deae;
      background:rgba(20,12,4,0.55);
    }

    .cta.secondary:hover{
      background:rgba(50,30,10,0.75);
      box-shadow:0 0 14px rgba(212,175,55,0.20);
    }

    @media (max-width: 900px){
      .nav-buttons{
        top:10px;
        right:10px;
        gap:8px;
      }

      .btn{
        padding:8px 12px;
        font-size:12px;
      }

      .hero{
        min-height:auto;
        padding:56px 0 0;
      }

      .buy-overlay{
        position:relative;
        left:auto;
        bottom:auto;
        transform:none;
        width:100%;
        max-width:none;
        margin-top:-8px;
        border-radius:0 0 22px 22px;
      }
    }
  </style>
</head>
<body>

  <div class="nav-buttons">
    <a href="uses.html" class="btn">← Uses</a>
    <a href="story-new.html" class="btn">Story</a>
  </div>

  <section class="hero">
    <div class="hero-wrap">
      <img src="chip.png" alt="Buy MyStoryChip" class="hero-image">

      <div class="buy-overlay">
        <p class="kicker">Own the Chip. Keep the Story.</p>
        <h1 class="headline">Bring it home.</h1>
        <p class="subtext">
          You’ve seen the story. You’ve seen the uses. Now this is the moment to make one yours.
        </p>

        <div class="price">$49.95</div>
        <p class="price-note">One-time purchase</p>

        <div class="mini-points">
          <div>250 MB included</div>
          <div>No membership required</div>
          <div>Simple tap-to-view experience</div>
        </div>

        <div class="cta-row">
          <a href="https://buy.stripe.com/5kQ28qgXefwm3XufRYdby00" class="cta primary">Buy Now</a>
          <a href="story-new.html" class="cta secondary">Read the Story</a>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
