<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<style>
body{
  background:#050505;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:rgba(255,255,255,0.05);
  padding:30px;
  border-radius:12px;
  width:300px;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  background:gold;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>Buy Your Chip</h2>

  <input type="text" id="customerName" placeholder="Full Name">
  <input type="email" id="customerEmail" placeholder="Email Address">

  <button id="buyBtn" type="button">Buy Now</button>
</div>

<script>
document.getElementById("buyBtn").addEventListener("click", function(){

  const name = document.getElementById("customerName").value.trim();
  const email = document.getElementById("customerEmail").value.trim();

  if(!name || !email){
    alert("Please enter your name and email first.");
    return;
  }

  window.location.href = "https://buy.stripe.com/00w5kCgXe1Fwcu05dkdby02";

});
</script>

</body>
</html>
