<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<style>
body {
  margin: 0;
  background: #000;
  font-family: Georgia, serif;
}

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: url("chip.png") center/cover no-repeat;
  overflow: hidden;
}

/* cover the baked right-side box */
.purchase-panel {
  position: absolute;
  right: 4.5%;
  top: 14%;
  width: 330px;
  min-height: 620px;
  z-index: 5;

  background: rgba(5, 5, 5, 0.96);
  border: 1px solid rgba(212,175,55,0.7);
  border-radius: 22px;
  padding: 28px 28px;

  color: #f5e6c8;
  box-shadow:
    0 0 30px rgba(212,175,55,0.35),
    inset 0 0 22px rgba(212,175,55,0.10);
}

.purchase-panel h2 {
  margin: 0 0 24px;
  text-align: center;
  color: #f5d97a;
  font-size: 1.65rem;
}

.purchase-panel ul {
  list-style: none;
  padding: 0;
  margin: 0 0 28px;
}

.purchase-panel li {
  margin-bottom: 18px;
  font-size: 1rem;
  line-height: 1.35;
}

.price {
  text-align: center;
  font-size: 2.9rem;
  color: #f5d97a;
  font-weight: bold;
  margin: 18px 0 4px;
}

.subprice {
  text-align: center;
  margin-bottom: 24px;
  color: #e8dcc0;
}

.get-chip {
  display: block;
  text-align: center;
  padding: 18px 20px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f8dd79, #d4af37, #a87818);
  color: #050505;
  font-size: 1.25rem;
  font-weight: bold;
  text-decoration: none;
  box-shadow:
    0 0 22px rgba(245,217,122,0.8),
    0 0 45px rgba(212,175,55,0.55);
}

.get-chip:hover {
  transform: scale(1.04);
}

.home-link {
  display: block;
  margin-top: 22px;
  text-align: center;
  color: #f5d97a;
  text-decoration: none;
}

/* invisible active areas over the lower left image icons */
.hotspot {
  position: absolute;
  z-index: 4;
  bottom: 7%;
  height: 95px;
}

.memorials { left: 37%; width: 9%; }
.cars { left: 47%; width: 9%; }
.family { left: 57%; width: 9%; }
.collections { left: 67%; width: 9%; }

@media (max-width: 900px) {
  .hero {
    height: auto;
    min-height: 100vh;
    background-position: center top;
  }

  .purchase-panel {
    position: relative;
    right: auto;
    top: auto;
    width: calc(100% - 32px);
    margin: 70vh auto 30px;
  }

  .hotspot {
    display: none;
  }
}
</style>
</head>

<body>

<div class="hero">

  <a class="hotspot memorials" href="story.html" aria-label="Memorials"></a>
  <a class="hotspot cars" href="story.html" aria-label="Cars and Restorations"></a>
  <a class="hotspot family" href="story.html" aria-label="Family Stories"></a>
  <a class="hotspot collections" href="story.html" aria-label="Collections"></a>

  <div class="purchase-panel">
    <h2>What You Get</h2>

    <ul>
      <li>✓ One physical MyStoryChip</li>
      <li>✓ 250 MB of included storage</li>
      <li>✓ Your own permanent story page</li>
      <li>✓ No subscription or monthly fee</li>
    </ul>

    <h2>Great For</h2>

    <ul>
      <li>• Memorials</li>
      <li>• Cars & Restorations</li>
      <li>• Family Stories</li>
      <li>• Collections</li>
    </ul>

    <div class="price">$49.95</div>
    <div class="subprice">One-time purchase</div>

    <a class="get-chip" href="https://buy.stripe.com/00w5kCgXe1Fwcu05dkdby02">
      GET YOUR CHIP →
    </a>

    <a class="home-link" href="index.html">Back to Home</a>
  </div>

</div>

</body>
</html>
