<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy MyStoryChip</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0a0a0a;
  color: #f5e6c8;
}

/* MAIN LAYOUT */
.wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 100vh;
  padding: 60px;
  gap: 40px;
}

/* LEFT SIDE */
.left {
  max-width: 600px;
}

.brand {
  font-size: 26px;
  color: #f5d97a;
  margin-bottom: 20px;
}

h1 {
  font-size: 60px;
  margin: 0 0 20px;
}

.sub {
  font-size: 22px;
  color: #e8dcc0;
  margin-bottom: 30px;
}

.price {
  font-size: 48px;
  color: #f5d97a;
  margin-bottom: 20px;
}

.note {
  margin-bottom: 30px;
  color: #cfc3a0;
}

/* BUTTON */
.btn {
  display: inline-block;
  background: #d4af37;
  color: black;
  padding: 18px 30px;
  border-radius: 40px;
  font-size: 20px;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  box-shadow: 0 0 25px rgba(212,175,55,0.5);
}

/* RIGHT IMAGE */
.right img {
  max-width: 650px;
  width: 100%;
  border-radius: 20px;
}

/* MOBILE */
@media(max-width:900px){
  .wrap {
    flex-direction: column;
    text-align: center;
  }

  h1 {
    font-size: 42px;
  }

  .right img {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="left">
    <div class="brand">MyStoryChip.com</div>

    <h1>Own the Chip.<br>Keep the Story.</h1>

    <div class="sub">
      Tap your phone. Instantly open a story, memory, or information — anywhere.
    </div>

    <div class="price">$49.95</div>

    <div class="note">
      One-time purchase. No monthly fees. You control everything.
    </div>

    <a href="PASTE_YOUR_STRIPE_LINK_HERE" class="btn">
      Buy Your Chip →
    </a>
  </div>

  <div class="right">
    <img src="buy-image.png">
  </div>

</div>

</body>
</html>
