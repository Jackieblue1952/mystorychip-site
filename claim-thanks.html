<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Chip Is Yours — MyStoryChip</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#010307; color:#dce3eb; font-family:Arial, Helvetica, sans-serif; padding:24px; box-sizing:border-box; }
  .card { max-width:520px; width:100%; background:#030914; border:1px solid #1d2a3d; border-radius:18px; padding:36px 28px; text-align:center;
          box-shadow:0 0 40px 8px rgba(190,205,225,.08); }
  .eyebrow { color:#32a4ff; letter-spacing:2px; font-size:14px; margin-bottom:12px; }
  h1 { font-size:32px; margin:0 0 16px; color:#ffffff; }
  .code { font-size:22px; letter-spacing:3px; color:#d4dce6; margin:0 0 24px; }
  p { font-size:19px; line-height:1.6; margin:0 0 16px; }
  .muted { color:#929eac; font-size:16px; }
  a { color:#32a4ff; }
</style>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
  <div class="card">
    <div class="eyebrow">MYSTORYCHIP</div>
    <h1>This chip is yours</h1>
    <div class="code" id="code"></div>
    <p>Check your email for your setup link from <strong>Storyteller@mystorychip.com</strong>.</p>
    <p>Use it to set your own PIN, then replace the sample story and photos with your own.</p>
    <p class="muted">The email can take a few minutes. If you don't see it, check your spam folder.</p>
  </div>
<script>
  const code = (new URLSearchParams(location.search).get("code") || "").trim();
  if (/^MSC-\d+$/i.test(code)) document.getElementById("code").textContent = "Chip Code: " + code.toUpperCase();
</script>
</body>
</html>
