<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Access</title>
  <style>
    body {
      background: #120805;
      color: #f5d8a2;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      text-align: center;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      background: #1a0b06;
      border: 1px solid #d6b37a;
      color: #fff;
    }
    .home-btn {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 10000;

  padding: 7px 15px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;

  color: #f5e6c8;
  text-decoration: none;

  background: rgba(212, 175, 55, 0.10);
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 999px;

  backdrop-filter: blur(4px);

  box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);

  transition: all 0.25s ease;
}

.home-btn:hover {
  background: rgba(212, 175, 55, 0.18);
  box-shadow:
    0 0 14px rgba(245, 217, 122, 0.25),
    0 0 28px rgba(212, 175, 55, 0.18);
}

    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #d6b37a;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
 <h2>MyStoryChip Admin</h2>
<p style="margin: 10px 0 18px; opacity: 0.8;">Enter your admin password to continue.</p>
<input type="password" id="pass" placeholder="Enter password" />
<div id="error" style="color: #ff6b6b; font-size: 14px; margin-top: 8px; display: none;">
  Incorrect password. Try again.
</div>
<br>
<button onclick="check()">Enter</button>  
</div>

<script>
function check() {
  const p = document.getElementById("pass").value;
 if (p === "MSC2026") {
  sessionStorage.setItem("adminAccess", "granted");
window.location.href = "dashboard.html";
} else {
 document.getElementById("error").style.display = "block"; 
  }
}
</script>

</body>
</html>
