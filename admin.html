<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Access</title>
  <style>
    body {
      background: #120805;
      color: #f5d8a2;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      text-align: center;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      background: #1a0b06;
      border: 1px solid #d6b37a;
      color: #fff;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #d6b37a;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
 <h2>MyStoryChip Admin</h2>
<p style="margin: 10px 0 18px; opacity: 0.8;">Enter your admin password to continue.</p>
<input type="password" id="pass" placeholder="Enter password" />
<div id="error" style="color: #ff6b6b; font-size: 14px; margin-top: 8px; display: none;">
  Incorrect password. Try again.
</div>
<br>
<button onclick="check()">Enter</button>  
</div>

<script>
function check() {
  const p = document.getElementById("pass").value;
 if (p === "MSC2026") {
  sessionStorage.setItem("adminAccess", "granted");
window.location.href = "dashboard.html";
} else {
 document.getElementById("error").style.display = "block"; 
  }
}
</script>

</body>
</html>
