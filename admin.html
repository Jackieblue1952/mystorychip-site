<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Access | MyStoryChip</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(16, 105, 190, 0.16), transparent 38%),
        linear-gradient(145deg, #020812 0%, #061426 48%, #020812 100%);
      color: #e8eef6;
      font-family: Arial, sans-serif;
    }

    .home-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 100;
      padding: 8px 16px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #dce8f5;
      text-decoration: none;
      background: rgba(12, 35, 59, 0.82);
      border: 1px solid rgba(157, 180, 205, 0.30);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      transition: all 0.25s ease;
    }

    .home-btn:hover {
      background: rgba(20, 63, 101, 0.95);
      border-color: rgba(82, 168, 255, 0.60);
    }

    .box {
      width: min(410px, 92vw);
      padding: 42px 32px 34px;
      text-align: center;
      background:
        linear-gradient(145deg, rgba(13, 37, 62, 0.97), rgba(4, 18, 33, 0.98));
      border: 1px solid rgba(155, 180, 205, 0.28);
      border-radius: 20px;
      box-shadow:
        0 24px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .logo {
      margin-bottom: 7px;
      font-family: Georgia, serif;
      font-size: 1.85rem;
      font-weight: bold;
      letter-spacing: 0.06em;
      color: #dce5ee;
      text-shadow: 0 0 18px rgba(93, 169, 255, 0.22);
    }

    h2 {
      margin: 0 0 9px;
      font-family: Georgia, serif;
      font-size: 1.25rem;
      color: #f2f6fa;
    }

    p {
      margin: 0 0 24px;
      color: #9eafc0;
      font-size: 0.88rem;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      font-size: 16px;
      background: #020b15;
      border: 1px solid rgba(145, 172, 199, 0.35);
      border-radius: 10px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #168cff;
      box-shadow: 0 0 0 3px rgba(22, 140, 255, 0.12);
    }

    .error {
      display: none;
      margin-top: 9px;
      color: #ff8080;
      font-size: 13px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 13px 20px;
      border: 1px solid rgba(125, 195, 255, 0.55);
      border-radius: 10px;
      background: linear-gradient(180deg, #168cff 0%, #0868c7 100%);
      color: #ffffff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow:
        0 8px 22px rgba(0, 103, 210, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 11px 26px rgba(0, 119, 235, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
<a class="home-btn" href="index.html">🏠 Home</a>
<div class="box">
  <div class="logo">MSC</div>
  <h2>MyStoryChip Admin</h2>
  <p>Enter your admin password to continue.</p>
  <input type="password" id="pass" placeholder="Enter password" maxlength="72" />
  <div id="error" class="error">Incorrect password. Try again.</div>
  <button onclick="check()">Enter</button>
</div>
<script>
  document.getElementById("pass").addEventListener("keydown", function(e) {
    if (e.key === "Enter") check();
  });

  async function check() {
    const password = document.getElementById("pass").value.trim();
    if (!password) return;
    try {
      const response = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      const result = await response.json();
      if (result.success) {
        localStorage.setItem("msc_admin_token", result.token);
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("error").style.display = "block";
        document.getElementById("pass").value = "";
        document.getElementById("pass").focus();
      }
    } catch (err) {
      document.getElementById("error").textContent = "Connection error. Please try again.";
      document.getElementById("error").style.display = "block";
    }
  }
</script>
</body>
</html>
