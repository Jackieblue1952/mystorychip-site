<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How It Works - MyStoryChip</title>

<style>

body {
  margin: 0;
  font-family: Georgia, serif;
  background: linear-gradient(180deg, #fff8ec 0%, #f5e6c8 100%);
  color: #3a2a12;
}

/* HERO SECTION */
.how-hero {
  position: relative;
  height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.hero-img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* LIGHT GOLD OVERLAY */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(255, 245, 220, 0.65);
}

/* TEXT */
.hero-content {
  position: relative;
  text-align: center;
  max-width: 700px;
  padding: 20px;
}

.hero-content h1 {
  font-size: 2.8rem;
  margin-bottom: 10px;
}

.hero-content p {
  font-size: 1.2rem;
}

/* STEPS */
.steps {
  display: flex;
  justify-content: space-around;
  padding: 60px 20px;
  background: #fff8ec;
  text-align: center;
  flex-wrap: wrap;
}

.step {
  max-width: 250px;
  margin: 20px;
}

.step h2 {
  font-size: 1.6rem;
  margin-bottom: 10px;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="how-hero">

  <img src="tap-demo.png" class="hero-img" alt="Tap the chip and view content">

  <div class="overlay"></div>

  <div class="hero-content">
    <h1>Tap the Chip. Instantly See the Story.</h1>
    <p>Your phone opens a private page with photos, information, and more.</p>
  </div>

</section>

<!-- STEPS -->
<section class="steps">

  <div class="step">
    <h2>1. Tap</h2>
    <p>Hold your phone near the chip</p>
  </div>

  <div class="step">
    <h2>2. It Opens</h2>
    <p>Your personal page loads instantly</p>
  </div>

  <div class="step">
    <h2>3. View or Share</h2>
    <p>See photos, details, and information</p>
  </div>

</section>

</body>
</html>
